name: Firebase tools
description: >-
  Install the pinned Firebase CLI used by emulator-backed CI jobs. The version
  and its entire transitive tree are locked in this action's committed
  package-lock.json and installed with `npm ci`, so nothing is resolved fresh at
  runtime (npm verifies every tarball against the lockfile's integrity hashes).
  Bump the version by editing package.json + regenerating package-lock.json.

runs:
  using: composite
  steps:
    # Install into the action's own directory from the committed lockfile, then
    # put its bin dir on PATH. `npm ci` fails hard if package.json and the lock
    # drift, which is exactly the guarantee we want here.
    - name: Install Firebase CLI (locked)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        npm ci --no-audit --no-fund
        echo "${GITHUB_ACTION_PATH}/node_modules/.bin" >> "${GITHUB_PATH}"
