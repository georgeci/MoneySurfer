name: Maestro setup
description: >-
  Install pinned Maestro + Allure + firebase-tools, write the
  scripts/e2e-test-user.properties file used by qaMaestro* and seed.sh. Shared
  between maestro-android and maestro-ios in the nightly workflow and the
  iOS offline workflow (with online-stack disabled).

inputs:
  online-stack:
    description: >-
      Install the online-suite tooling (Node + Firebase CLI, Allure CLI) and
      write scripts/e2e-test-user.properties. Set to "false" for offline
      Maestro lanes (qaMaestroOffline*) that need only the Maestro CLI — the
      offline app talks to no Firebase emulator and has no test users.
    required: false
    default: "true"
  test-email:
    description: TEST_EMAIL written to scripts/e2e-test-user.properties.
    required: false
    default: e2e+owner@test.local
  test-password:
    description: TEST_PASSWORD written to scripts/e2e-test-user.properties.
    required: false
    default: password
  test-viewer-email:
    description: TEST_VIEWER_EMAIL written to scripts/e2e-test-user.properties.
    required: false
    default: e2e+viewer@test.local

runs:
  using: composite
  steps:
    - name: Set up Node.js
      if: ${{ inputs.online-stack == 'true' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "20"

    - name: Install Firebase CLI
      if: ${{ inputs.online-stack == 'true' }}
      uses: ./.github/actions/firebase-tools

    # Pinned to a specific Maestro release + sha256-verified to avoid running
    # whatever the install script serves at runtime.
    - name: Install Maestro CLI (pinned)
      shell: bash
      env:
        MAESTRO_VERSION: "2.5.1"
        MAESTRO_SHA256: "2d924bfd37cccabca438a727213648cbfe4f8bb711559ec8e9d199dc09a5ce52"
      run: |
        set -euo pipefail
        url="https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
        tmp="${RUNNER_TEMP}/maestro.zip"
        # --proto "=https" refuses any redirect off HTTPS (Sonar S6506).
        curl --proto "=https" -fsSL "$url" -o "$tmp"
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$tmp" | awk '{print $1}')"
        else
          actual="$(shasum -a 256 "$tmp" | awk '{print $1}')"
        fi
        if [ "$actual" != "$MAESTRO_SHA256" ]; then
          echo "Maestro checksum mismatch: expected $MAESTRO_SHA256, got $actual" >&2
          exit 1
        fi
        unzip -q "$tmp" -d "$HOME/.maestro"
        echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"

    - name: Install Allure CLI
      if: ${{ inputs.online-stack == 'true' }}
      uses: ./.github/actions/allure-cli

    # qa.gradle.kts reads TEST_EMAIL/TEST_PASSWORD from this file and forwards
    # them to Maestro via `--env`. seed.sh reads the same file to provision
    # users in the Auth emulator. Defaults match seed.sh so the workflow runs
    # without any E2E_* secrets configured.
    - name: Write e2e test-user properties
      if: ${{ inputs.online-stack == 'true' }}
      shell: bash
      env:
        TEST_EMAIL: ${{ inputs.test-email }}
        TEST_PASSWORD: ${{ inputs.test-password }}
        TEST_VIEWER_EMAIL: ${{ inputs.test-viewer-email }}
      run: |
        cat > scripts/e2e-test-user.properties <<EOF
        TEST_EMAIL=${TEST_EMAIL}
        TEST_PASSWORD=${TEST_PASSWORD}
        TEST_VIEWER_EMAIL=${TEST_VIEWER_EMAIL}
        EOF
