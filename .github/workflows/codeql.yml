name: CodeQL

on:
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Weekly run picks up new CodeQL queries even on quiet weeks.
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same fan-out gate as ci.yml, via job-level `if:` instead of top-level
  # `paths-ignore` so required status checks still report.
  #
  # The gate also composes the analysis matrix, because the two legs have
  # nothing to do with each other: all JavaScript in this repo lives under
  # firestore-tests/, so a Kotlin PR used to spin up a second 40-minute-budget
  # runner to analyse an unchanged Mocha suite, and vice versa. A job-level
  # `if:` cannot read the `matrix` context, so the legs are selected here and
  # fed to `strategy.matrix` via fromJSON. Schedule and manual runs take both.
  #
  # CAVEAT — this is the one gate in the repo that does not preserve "a skipped
  # job still reports". A job skipped by its `if:` reports as skipped and
  # satisfies a required status check; a matrix leg that is absent from the
  # matrix produces no check run at all. `main` currently has no required
  # status checks, so nothing is blocked today. If `Analyze (java-kotlin)` or
  # `Analyze (javascript-typescript)` is ever made required, this must go back
  # to a static two-leg matrix with the per-leg gate moved onto the steps —
  # otherwise a Kotlin-only PR waits forever for a check that never appears.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.legs }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Shared path filter — see .github/actions/paths-gate.
      - name: Filter paths
        id: gate
        uses: ./.github/actions/paths-gate

      - name: Compose analysis matrix
        id: matrix
        shell: bash
        env:
          # On a schedule the filter can only see the last commit on main (no
          # base ref to diff against), which says nothing about what the weekly
          # scan should cover — so force both legs, as before.
          FORCE_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          ANDROID: ${{ steps.gate.outputs.android }}
          JS: ${{ steps.gate.outputs.js }}
        run: |
          set -euo pipefail
          legs=()
          if [[ "$FORCE_ALL" == "true" || "$ANDROID" == "true" ]]; then
            legs+=('{"language":"java-kotlin","build-mode":"manual"}')
          fi
          if [[ "$FORCE_ALL" == "true" || "$JS" == "true" ]]; then
            legs+=('{"language":"javascript-typescript","build-mode":"none"}')
          fi
          if [[ ${#legs[@]} -eq 0 ]]; then
            echo "legs={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No CodeQL-relevant changes — analysis skipped."
            exit 0
          fi
          printf -v joined '%s,' "${legs[@]}"
          echo "legs={\"include\":[${joined%,}]}" >> "$GITHUB_OUTPUT"
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "Analysing: ${joined%,}"

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    # An empty matrix is a hard error, so gate on the gate's own verdict.
    if: needs.changes.outputs.any == 'true'
    permissions:
      security-events: write
      actions: read
      contents: read
    # Fork PRs can't read Firebase secrets, so the Gradle build for
    # java-kotlin would fail on processDebugGoogleServices. JS analysis
    # needs no secrets and runs on every PR.

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      # Egress audit — see docs/security/ci-egress-hardening.md (issue #180).
      # The java-kotlin leg decodes Firebase config for the tracer build; run
      # unconditionally so both matrix legs are baselined.
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        if: >-
          matrix.language != 'java-kotlin' ||
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decode Firebase config
        if: >-
          matrix.language == 'java-kotlin' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        if: >-
          matrix.language == 'java-kotlin' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: >-
          matrix.language == 'java-kotlin' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        if: >-
          matrix.language != 'java-kotlin' ||
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # CodeQL sizes `ram` against the runner's *total* 16 GB, not what is
          # actually free, and the Gradle + Kotlin daemons are still resident
          # here (see the daemon-stop step below). This cap leaves the OS
          # headroom but is not on its own sufficient — 12288 still flaked on
          # PR #240 until the daemons were stopped before analysis.
          ram: 12288

      - name: Build Kotlin sources
        if: >-
          matrix.language == 'java-kotlin' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        # --rerun-tasks: CodeQL's tracer only sees compilation if it actually
        # runs — Gradle cache hits (FROM-CACHE / UP-TO-DATE) leave the database
        # empty and the analyze step fails with "could not process any code".
        run: ./gradlew :androidApp:processDebugGoogleServices :androidApp:compileDebugSources --rerun-tasks --stacktrace

      # Both daemons outlive the build step: setup-gradle only stops them in its
      # post-job step, which runs *after* the analysis. Between them they can
      # hold ~12 GB (org.gradle.jvmargs / kotlin.daemon.jvmargs are -Xmx6144M
      # each in gradle.properties), and CodeQL then asks for 12 GB more on a
      # 16 GB runner. The overcommit is what actually kills the job — either the
      # VM dies mid-evaluation ("runner has received a shutdown signal") or it
      # thrashes swap until the 40-minute timeout. Reclaim the heap first.
      - name: Stop Gradle and Kotlin daemons
        if: >-
          matrix.language == 'java-kotlin' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          ./gradlew --stop
          # --stop only reaps Gradle's own daemon; the Kotlin compile daemon is
          # a separate process that would otherwise idle on for another 3h.
          pkill -f KotlinCompileDaemon || true
          free -h

      - name: Perform CodeQL analysis
        if: >-
          matrix.language != 'java-kotlin' ||
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
