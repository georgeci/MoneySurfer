name: CodeQL

on:
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Weekly run picks up new CodeQL queries even on quiet weeks.
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same fan-out gate as ci.yml: skip CodeQL on doc-only / AI-tooling changes
  # via job-level `if:` instead of top-level `paths-ignore`, so required
  # status checks still report. Schedule-triggered runs always proceed.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Shared path filter — see .github/actions/paths-gate.
      - name: Filter paths
        id: gate
        uses: ./.github/actions/paths-gate

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    # Run on schedule unconditionally; otherwise only when code paths changed.
    if: >-
      github.event_name == 'schedule' ||
      needs.changes.outputs.code == 'true'
    permissions:
      security-events: write
      actions: read
      contents: read
    # Fork PRs can't read Firebase secrets, so the Gradle build for
    # java-kotlin would fail on processDebugGoogleServices. JS analysis
    # needs no secrets and runs on every PR.

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      # Egress audit — see docs/security/ci-egress-hardening.md (issue #180).
      # The java-kotlin leg decodes Firebase config for the tracer build; run
      # unconditionally so both matrix legs are baselined.
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        if: >-
          matrix.language != 'java-kotlin' ||
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decode Firebase config
        if: >-
          matrix.language == 'java-kotlin' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        if: >-
          matrix.language == 'java-kotlin' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: >-
          matrix.language == 'java-kotlin' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Initialize CodeQL
        if: >-
          matrix.language != 'java-kotlin' ||
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # CodeQL sizes `ram` against the runner's *total* 16 GB, not what is
          # actually free, and the Gradle + Kotlin daemons are still resident
          # here (see the daemon-stop step below). This cap leaves the OS
          # headroom but is not on its own sufficient — 12288 still flaked on
          # PR #240 until the daemons were stopped before analysis.
          ram: 12288

      - name: Build Kotlin sources
        if: >-
          matrix.language == 'java-kotlin' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        # --rerun-tasks: CodeQL's tracer only sees compilation if it actually
        # runs — Gradle cache hits (FROM-CACHE / UP-TO-DATE) leave the database
        # empty and the analyze step fails with "could not process any code".
        run: ./gradlew :androidApp:processDebugGoogleServices :androidApp:compileDebugSources --rerun-tasks --stacktrace

      # Both daemons outlive the build step: setup-gradle only stops them in its
      # post-job step, which runs *after* the analysis. Between them they can
      # hold ~12 GB (org.gradle.jvmargs / kotlin.daemon.jvmargs are -Xmx6144M
      # each in gradle.properties), and CodeQL then asks for 12 GB more on a
      # 16 GB runner. The overcommit is what actually kills the job — either the
      # VM dies mid-evaluation ("runner has received a shutdown signal") or it
      # thrashes swap until the 40-minute timeout. Reclaim the heap first.
      - name: Stop Gradle and Kotlin daemons
        if: >-
          matrix.language == 'java-kotlin' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          ./gradlew --stop
          # --stop only reaps Gradle's own daemon; the Kotlin compile daemon is
          # a separate process that would otherwise idle on for another 3h.
          pkill -f KotlinCompileDaemon || true
          free -h

      - name: Perform CodeQL analysis
        if: >-
          matrix.language != 'java-kotlin' ||
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
