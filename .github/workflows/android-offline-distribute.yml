name: Android offline distribute

# Builds the signed release APK of :androidApp-offline and uploads it to
# Firebase App Distribution. Firebase is only the delivery channel: no Firebase
# SDK or google-services.json is packaged in the offline app.

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Firebase App Distribution tester group alias(es), comma-separated"
        required: false
        default: "testers"
      notes:
        description: "Release notes (default: subject of the built commit)"
        required: false
        default: ""
  schedule:
    # 04:07 UTC — after the online Android distribution slot.
    - cron: "7 4 * * *"

concurrency:
  group: android-offline-distribute
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  distribute:
    name: Build + upload offline release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read

    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check required configuration
        id: preflight
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_OFFLINE_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=(ANDROID_RELEASE_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(ANDROID_RELEASE_STORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ANDROID_RELEASE_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(ANDROID_RELEASE_KEY_PASSWORD)
          [ -n "$SERVICE_ACCOUNT" ] || missing+=(FIREBASE_SERVICE_ACCOUNT_JSON)
          [ -n "$FIREBASE_APP_ID" ] || missing+=(FIREBASE_ANDROID_OFFLINE_APP_ID)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "::error::Missing secrets/variables: ${missing[*]} — see docs/ci/app-distribution.md"
            exit 1
          fi
          echo "::notice::Missing secrets/variables: ${missing[*]} — skipping scheduled distribute."

      - name: Skip if no new commits since last successful run
        id: check
        if: steps.preflight.outputs.ready == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          last_sha=$(gh run list \
            --workflow=android-offline-distribute.yml \
            --branch=main \
            --status=success \
            --limit=2 \
            --json headSha,databaseId \
            --repo "${GITHUB_REPOSITORY}" \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }})][0].headSha // ""')
          echo "last successful SHA: ${last_sha:-<none>}"
          echo "current SHA:         ${GITHUB_SHA}"
          if [[ -n "$last_sha" && "$last_sha" == "$GITHUB_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decode release keystore
        id: keystore
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$dest"
          if [ ! -s "$dest" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          chmod 600 "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble signed offline release APK
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :androidApp-offline:assembleRelease --stacktrace

      - name: Locate and verify the APK
        id: apk
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find androidApp-offline/build/outputs/apk/release -name '*.apk' -type f | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK produced by :androidApp-offline:assembleRelease."
            exit 1
          fi
          apksigner=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under ANDROID_HOME — cannot verify the signature."
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk" > /dev/null \
            || { echo "::error::$apk is not signed."; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"

      - name: Install Firebase CLI
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        uses: ./.github/actions/firebase-tools

      - name: Upload to Firebase App Distribution
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APK: ${{ steps.apk.outputs.path }}
          APP_ID: ${{ vars.FIREBASE_ANDROID_OFFLINE_APP_ID }}
          GROUPS_INPUT: ${{ inputs.groups }}
          NOTES_INPUT: ${{ inputs.notes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          creds="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$creds"
          chmod 600 "$creds"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds"

          notes="${NOTES_INPUT:-}"
          if [ -z "$notes" ]; then
            notes="$(git log -1 --pretty=%s)"
          fi
          notes="${notes}"$'\n\n'"offline build ${GITHUB_RUN_NUMBER}"$'\n'"commit ${GITHUB_SHA}"$'\n'"${RUN_URL}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tester_groups="$GROUPS_INPUT"
          else
            tester_groups="testers"
          fi
          group_args=()
          if [ -n "$tester_groups" ]; then
            group_args=(--groups "$tester_groups")
          else
            echo "::notice::No tester group given — uploading without distributing."
          fi

          firebase appdistribution:distribute "$APK" \
            --app "$APP_ID" \
            "${group_args[@]}" \
            --release-notes "$notes"

          {
            echo "### Firebase App Distribution — Android offline"
            echo
            echo "- APK: \`$(basename "$APK")\`"
            echo "- Groups: \`${tester_groups:-<none>}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shred credentials
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/release.jks" "${RUNNER_TEMP}/firebase-service-account.json"

      - name: Upload APK artifact
        if: steps.apk.outputs.path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: androidApp-offline-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error
