name: Nightly

# Heavy / expensive jobs that don't need to gate every PR. Runs once a day
# against the default branch and on demand via workflow_dispatch.
#
# Cost note: macos-14 runners are ~10x more expensive than ubuntu, which is
# why iOS verification lives here instead of in the per-PR ci.yml.
#
# qa-all covers every test scope (common, android-host, android-device,
# maestro, firestore) and publishes Allure (with history) + Kover under
# /nightly/ on Pages. It self-skips when no commits landed since the last
# successful nightly.

on:
  schedule:
    # 03:17 UTC every day. Off-peak slot, off the hour to avoid GH cron jitter
    # piling up at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write    # qa-all publishes to gh-pages
  actions: read      # decide queries `gh run list`

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  ios-build:
    name: iOS simulator build
    runs-on: macos-14
    timeout-minutes: 40
    # Lean Debug build for iOS Simulator (arm64), no code signing, no archive,
    # no Crashlytics dSYM upload. Verifies the Kotlin framework links and the
    # Swift code compiles end-to-end against the embedded framework.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # iOS build only needs the GoogleService-Info.plist — don't expose the
      # Android secrets to this job. (Can't use require-all=true here: it
      # validates every input, not just the ones we passed.)
      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          ios-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show Xcode version
        run: xcodebuild -version

      # Pre-link the Kotlin framework for the simulator arch so the Xcode build
      # phase has its inputs ready and SPM resolution doesn't race with Gradle
      # on first run.
      - name: Link Kotlin framework (iosSimulatorArm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build iOS app (Simulator, no signing)
        env:
          SKIP_CRASHLYTICS_UPLOAD: "YES"
        run: |
          set -eo pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            FORMATTER=(xcbeautify --renderer github-actions)
          else
            FORMATTER=(cat)
          fi
          # -derivedDataPath requires -scheme/-testProductsPath/-xctestrun;
          # we use -target so let xcodebuild pick the default location.
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | "${FORMATTER[@]}"

  decide:
    name: Skip if no changes since last successful run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check last successful nightly SHA
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — running unconditionally."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Most recent already-finished successful nightly. Self-exclude in
          # case the API briefly lists this very run while it's still queued.
          last_sha=$(gh run list \
            --workflow=nightly.yml \
            --branch=main \
            --status=success \
            --limit=2 \
            --json headSha,databaseId \
            --repo "${GITHUB_REPOSITORY}" \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }})][0].headSha // ""')
          echo "last successful SHA: ${last_sha:-<none>}"
          echo "current SHA:         ${GITHUB_SHA}"
          if [[ -n "$last_sha" && "$last_sha" == "$GITHUB_SHA" ]]; then
            echo "No new commits since last nightly success — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  qa-all:
    name: qaAll (all scopes)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      # firebase-tools ≥14 (used by qaFirestoreRules + qaMaestro) needs JDK 21+
      # for the Firestore emulator JAR. AGP/Kotlin happily build on 21 too, so
      # we use a single JDK for the whole nightly job.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install firebase-tools
        run: npm i -g firebase-tools

      - name: Install firestore-tests deps
        working-directory: firestore-tests
        run: npm ci

      - name: Install Allure CLI
        shell: bash
        run: |
          set -euo pipefail
          ALLURE_VERSION=2.34.1
          curl -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "${GITHUB_PATH}"

      # Pin Maestro to a specific version. The install script honours
      # MAESTRO_VERSION; without it we'd always pull `latest` and re-execute
      # whatever the upstream script happens to be — both a reproducibility
      # and a supply-chain concern. Bump deliberately when the qaMaestro flows
      # need newer CLI features.
      - name: Install Maestro CLI
        shell: bash
        env:
          MAESTRO_VERSION: "2.5.1"
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          installed="$("$HOME/.maestro/bin/maestro" --version 2>/dev/null || true)"
          if [[ "$installed" != *"$MAESTRO_VERSION"* ]]; then
            echo "::error::Maestro version mismatch: wanted $MAESTRO_VERSION, got '$installed'."
            exit 1
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ubuntu-latest has nested-virt available but KVM device perms aren't set
      # up by default — this udev rule grants r/w so the AVD can boot.
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run qaAll inside emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew qaAll --stacktrace

      - name: Upload native Allure results (Maestro)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-allure-results-maestro
          path: build/allure-results/maestro/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-maestro-debug
          path: |
            build/maestro-debug/
            build/maestro-artifacts/
            build/logs/maestro/
          if-no-files-found: warn
          retention-days: 14

      # Stage every supported Allure input dir (JUnit XML + native JSON) into
      # one flat tree for simple-elf to consume in the publish step below.
      - name: Stage Allure results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p allure-results
          # JUnit XMLs across all scopes.
          find . -type f -name '*.xml' \
            \( -path '*/build/test-results/jvmTest/*' \
            -o -path '*/build/test-results/testAndroidHostTest/*' \
            -o -path '*/build/outputs/androidTest-results/*' \
            -o -path '*/build/test-results/firestore/*' \) \
            -not -path './gh-pages/*' \
            | while read -r f; do
              dest="allure-results/$(echo "${f#./}" | tr '/' '__')"
              cp "$f" "$dest"
            done
          # Maestro: native JSON + metadata, copied verbatim.
          if [[ -d build/allure-results/maestro ]]; then
            cp -r build/allure-results/maestro/. allure-results/
          fi
          echo "Staged $(ls allure-results 2>/dev/null | wc -l) input(s)."

      - name: Checkout gh-pages
        if: always()
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Ensure gh-pages dir exists
        if: always()
        shell: bash
        run: mkdir -p gh-pages/nightly/allure

      - name: Build Allure report (with history)
        if: always()
        uses: simple-elf/allure-report-action@53ebb757a2097edc77c53ecef4d454fc2f2f774c # v1.13
        with:
          allure_results: allure-results
          gh_pages: gh-pages/nightly/allure
          allure_report: allure-report
          allure_history: allure-history

      - name: Assemble Pages payload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/nightly/allure public/nightly/kover
          if [[ -d allure-history ]]; then
            cp -r allure-history/. public/nightly/allure/
          fi
          if [[ -d build/reports/kover/html ]]; then
            cp -r build/reports/kover/html/. public/nightly/kover/
          fi

      - name: Deploy to gh-pages (/nightly/)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          commit_message: "docs(ci): nightly reports for ${{ github.sha }}"
