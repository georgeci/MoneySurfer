name: Nightly

# Heavy / expensive jobs that don't need to gate every PR. Runs once a day
# against the default branch and on demand via workflow_dispatch.
#
# Cost note: macos-15 runners are ~10x more expensive than ubuntu, which is
# why iOS verification lives here instead of in the per-PR ci.yml.

on:
  schedule:
    # 03:17 UTC every day. Off-peak slot, off the hour to avoid GH cron jitter
    # piling up at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  decide:
    name: Skip if no changes since last successful run
    runs-on: ubuntu-latest
    permissions:
      actions: read    # `gh run list` against this workflow
      contents: read   # implicit checkout token scope, kept explicit
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check last successful nightly SHA
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — running unconditionally."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Most recent already-finished successful nightly. Self-exclude in
          # case the API briefly lists this very run while it's still queued.
          last_sha=$(gh run list \
            --workflow=nightly.yml \
            --branch=main \
            --status=success \
            --limit=2 \
            --json headSha,databaseId \
            --repo "${GITHUB_REPOSITORY}" \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }})][0].headSha // ""')
          echo "last successful SHA: ${last_sha:-<none>}"
          echo "current SHA:         ${GITHUB_SHA}"
          if [[ -n "$last_sha" && "$last_sha" == "$GITHUB_SHA" ]]; then
            echo "No new commits since last nightly success — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  android-compile:
    name: Android debug compile
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Compile-only: catches AGP/Kotlin/google-services regressions without
    # needing the dev keystore (assembleDebug would require DEV_* secrets,
    # see androidApp/build.gradle.kts -> signingConfigs.dev).

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Android debug
        run: ./gradlew :androidApp:processDebugGoogleServices :androidApp:compileDebugSources --stacktrace

  android-offline-compile:
    name: Android offline debug compile
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile offline Android debug
        run: ./gradlew :androidApp-offline:compileDebugSources --stacktrace


  ios-build:
    name: iOS simulator build
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    # Lean Debug build for iOS Simulator (arm64), no code signing, no archive,
    # no Crashlytics dSYM upload. Verifies the Kotlin framework links and the
    # Swift code compiles end-to-end against the embedded framework.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # iOS build only needs the GoogleService-Info.plist — don't expose the
      # Android secrets to this job. (Can't use require-all=true here: it
      # validates every input, not just the ones we passed.)
      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          ios-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show Xcode version
        run: xcodebuild -version

      # Pre-link the Kotlin framework for the simulator arch so the Xcode build
      # phase has its inputs ready and SPM resolution doesn't race with Gradle
      # on first run.
      - name: Link Kotlin framework (iosSimulatorArm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build iOS app (Simulator, no signing)
        env:
          SKIP_CRASHLYTICS_UPLOAD: "YES"
        run: |
          set -eo pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            FORMATTER=(xcbeautify --renderer github-actions)
          else
            FORMATTER=(cat)
          fi
          # -derivedDataPath requires -scheme/-testProductsPath/-xctestrun;
          # we use -target so let xcodebuild pick the default location.
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | "${FORMATTER[@]}"

  ios-offline-build:
    name: iOS offline simulator build
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    # Mirror of ios-build for the offline variant (composeAppOffline +
    # iosAppOffline). No Firebase plist is needed — the offline app must build
    # without any networked services baked in.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Link Kotlin framework (iosSimulatorArm64, offline)
        run: ./gradlew :composeAppOffline:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build iOS offline app (Simulator, no signing)
        run: |
          set -eo pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            FORMATTER=(xcbeautify --renderer github-actions)
          else
            FORMATTER=(cat)
          fi
          xcodebuild \
            -project iosAppOffline/iosAppOffline.xcodeproj \
            -target iosAppOffline \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | "${FORMATTER[@]}"

  maestro-android:
    name: Maestro Android (E2E)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # Heavy: builds debug APK with USE_EMULATOR=true, boots AVD + Firebase
    # Emulator (auth + firestore), seeds test users, runs all flows in
    # scripts/maestro/, generates Allure. Lives in nightly because the AVD
    # boot alone is ~5–8 min.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}

      # firebase-tools ≥14 ships a Firestore emulator JAR that needs JDK 21+.
      # Same caveat as the firestore-rules job in ci.yml.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Maestro + Allure + e2e creds
        uses: ./.github/actions/maestro-setup
        with:
          test-email:        ${{ secrets.E2E_TEST_EMAIL        || 'e2e+owner@test.local' }}
          test-password:     ${{ secrets.E2E_TEST_PASSWORD     || 'password' }}
          test-viewer-email: ${{ secrets.E2E_TEST_VIEWER_EMAIL || 'e2e+viewer@test.local' }}

      # Hardware acceleration for the AVD. The runner image ships KVM but the
      # default user isn't in the kvm group.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run qaMaestroAndroid
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          disable-spellchecker: true
          force-avd-creation: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew qaMaestroAndroid --stacktrace

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-maestro-android
          path: build/reports/allure/maestro/
          if-no-files-found: warn
          retention-days: 14

      # Native Allure results — JSON test bodies, screenshots, executor metadata.
      # Consumed by the nightly-publish aggregator so the Pages report keeps
      # Maestro's per-step screenshots instead of degrading to bare JUnit.
      - name: Upload Allure results (native)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-maestro-android
          path: build/allure-results/maestro/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-junit
          path: build/test-results/maestro/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Maestro debug + screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-debug
          path: |
            build/maestro-debug/
            build/maestro-artifacts/
            build/logs/maestro/
          if-no-files-found: ignore
          retention-days: 7

  maestro-ios:
    name: Maestro iOS (E2E)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    # Same shape as maestro-android but on a macOS runner: boots an iPhone
    # simulator, builds the Debug app with MS_USE_EMULATOR=YES, runs flows.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          ios-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Maestro + Allure + e2e creds
        uses: ./.github/actions/maestro-setup
        with:
          test-email:        ${{ secrets.E2E_TEST_EMAIL        || 'e2e+owner@test.local' }}
          test-password:     ${{ secrets.E2E_TEST_PASSWORD     || 'password' }}
          test-viewer-email: ${{ secrets.E2E_TEST_VIEWER_EMAIL || 'e2e+viewer@test.local' }}

      - name: Show Xcode version
        run: xcodebuild -version

      # macos runner images can have multiple available iPhone simulators with
      # the same name across iOS runtimes. Pick the highest-iOS device and emit
      # both name (xcodebuild -destination uses name=...) and UDID (Maestro
      # `--device` and `simctl boot/install`) so the build, install and run
      # steps all target the exact same simulator.
      - name: Boot iOS simulator
        id: ios-sim
        shell: bash
        run: |
          set -euo pipefail
          read -r SIM_UDID SIM_NAME SIM_RUNTIME < <(xcrun simctl list devices available -j \
            | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              # Sort key: iOS version tuple from the runtime identifier.
              m = re.search(r"iOS-(\d+)-(\d+)", runtime) or re.search(r"iOS (\d+)\.(\d+)", runtime)
              version = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      candidates.append((version, d["udid"], d["name"], runtime))
          if not candidates:
              sys.exit(0)
          # Prefer the iPhone family closest to qa.gradle.kts default ("iPhone 17"),
          # fall back to highest iOS version of any iPhone.
          for prefix in ("iPhone 17", "iPhone 16", "iPhone 15"):
              filtered = [c for c in candidates if c[2].startswith(prefix)]
              if filtered:
                  filtered.sort(reverse=True)
                  v, udid, name, rt = filtered[0]
                  print(f"{udid} {name} {rt}"); sys.exit(0)
          candidates.sort(reverse=True)
          v, udid, name, rt = candidates[0]
          print(f"{udid} {name} {rt}")
          ') || true
          if [ -z "${SIM_UDID:-}" ]; then
            echo "No iPhone simulator available on this runner image." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $SIM_NAME ($SIM_RUNTIME) — $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
          echo "name=$SIM_NAME" >> "$GITHUB_OUTPUT"

      - name: Run qaMaestroIos
        run: |
          ./gradlew qaMaestroIos \
            -PiosSimulatorName="${{ steps.ios-sim.outputs.name }}" \
            -PiosSimulatorUdid="${{ steps.ios-sim.outputs.udid }}" \
            --stacktrace

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-maestro-ios
          path: build/reports/allure/maestro-ios/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure results (native)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-maestro-ios
          path: build/allure-results/maestro-ios/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-junit
          path: build/test-results/maestro-ios/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Maestro debug + screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-debug
          path: |
            build/maestro-ios-debug/
            build/maestro-ios-artifacts/
            build/logs/maestro-ios/
          if-no-files-found: ignore
          retention-days: 7

  nightly-publish:
    name: Aggregate + publish nightly to Pages
    needs: [decide, maestro-android, maestro-ios]
    if: always() && needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Prefer the native Allure results (JSON + screenshots) so the published
      # report keeps Maestro per-step UI evidence. Fall back to JUnit XML when
      # the native artifact is missing — happens if the prep task crashed *and*
      # never managed to write `executor.json` (extremely rare given the
      # in-Gradle fallback in qa.gradle.kts → writeAllureFallbackMetadata).
      - name: Download Maestro Android Allure results (native)
        uses: actions/download-artifact@v8
        with:
          name: allure-results-maestro-android
          path: allure-input-native/maestro-android
        continue-on-error: true

      - name: Download Maestro iOS Allure results (native)
        uses: actions/download-artifact@v8
        with:
          name: allure-results-maestro-ios
          path: allure-input-native/maestro-ios
        continue-on-error: true

      - name: Download Maestro Android JUnit (fallback)
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-junit
          path: allure-input/maestro-android
        continue-on-error: true

      - name: Download Maestro iOS JUnit (fallback)
        uses: actions/download-artifact@v8
        with:
          name: maestro-ios-junit
          path: allure-input/maestro-ios
        continue-on-error: true

      - name: Stage Allure results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p allure-results
          # 1) Native Allure: copy result.json bodies + attachment binaries
          #    verbatim. Filenames are uuid4-based (per maestro_to_allure.py)
          #    so they cannot collide across Android/iOS scopes.
          #
          #    `executor.json` and `environment.properties` are intentionally
          #    skipped: the converter writes them per scope, but flattening
          #    into one dir would silently overwrite one scope's metadata with
          #    the other's. Per-scope copies remain available in the
          #    `allure-results-maestro-{android,ios}` artifacts for anyone
          #    debugging the converter output.
          if [ -d allure-input-native ]; then
            find allure-input-native -type f 2>/dev/null | while read -r f; do
              base="$(basename "$f")"
              case "$base" in
                executor.json|environment.properties) continue ;;
              esac
              cp "$f" "allure-results/$base"
            done
          fi
          native_count=$(ls allure-results 2>/dev/null | wc -l)
          # 2) JUnit fallback: only stage XMLs we don't already have native
          #    data for. Treat presence of any `*-result.json` for a scope as
          #    "native data is here" and skip its JUnit to avoid duplicate
          #    suites. Guarded by `[ -d allure-input ]` because both fallback
          #    downloads use `continue-on-error: true` and may leave the dir
          #    absent — `find` on a missing path would otherwise abort the
          #    whole job under `set -e`.
          have_android_native=false; have_ios_native=false
          if compgen -G "allure-input-native/maestro-android/*-result.json" > /dev/null; then
            have_android_native=true
          fi
          if compgen -G "allure-input-native/maestro-ios/*-result.json" > /dev/null; then
            have_ios_native=true
          fi
          if [ -d allure-input ]; then
            find allure-input -type f -name '*.xml' 2>/dev/null | while read -r f; do
              case "$f" in
                allure-input/maestro-android/*) $have_android_native && continue ;;
                allure-input/maestro-ios/*)     $have_ios_native     && continue ;;
              esac
              dest="allure-results/$(echo "${f#allure-input/}" | tr '/' '__')"
              cp "$f" "$dest"
            done
          fi
          total=$(ls allure-results 2>/dev/null | wc -l)
          echo "Staged $total input(s) ($native_count native, $((total - native_count)) JUnit fallback)."

      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Ensure gh-pages dir exists
        shell: bash
        run: mkdir -p gh-pages/nightly/allure

      - name: Build Allure report (with history)
        uses: simple-elf/allure-report-action@53ebb757a2097edc77c53ecef4d454fc2f2f774c # v1.13
        with:
          allure_results: allure-results
          gh_pages: gh-pages/nightly/allure
          allure_report: allure-report
          allure_history: allure-history

      - name: Assemble Pages payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/nightly/allure
          if [[ -d allure-history ]]; then
            cp -r allure-history/. public/nightly/allure/
          fi

      # keep_files: true preserves the per-push /allure/ + /kover/ subtrees
      # that the ci.yml `publish` job manages independently.
      - name: Deploy to gh-pages (/nightly/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          commit_message: "docs(ci): nightly reports for ${{ github.sha }}"
