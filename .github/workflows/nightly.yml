name: Nightly

# Heavy / expensive jobs that don't need to gate every PR. Runs once a day
# against the default branch and on demand via workflow_dispatch.
#
# Cost note: macos-15 runners are ~10x more expensive than ubuntu, which is
# why iOS verification lives here instead of in the per-PR ci.yml.

on:
  schedule:
    # 03:17 UTC every day. Off-peak slot, off the hour to avoid GH cron jitter
    # piling up at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  decide:
    name: Skip if no changes since last successful run
    runs-on: ubuntu-latest
    permissions:
      actions: read    # `gh run list` against this workflow
      contents: read   # implicit checkout token scope, kept explicit
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check last successful nightly SHA
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — running unconditionally."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Most recent already-finished successful nightly. Self-exclude in
          # case the API briefly lists this very run while it's still queued.
          last_sha=$(gh run list \
            --workflow=nightly.yml \
            --branch=main \
            --status=success \
            --limit=2 \
            --json headSha,databaseId \
            --repo "${GITHUB_REPOSITORY}" \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }})][0].headSha // ""')
          echo "last successful SHA: ${last_sha:-<none>}"
          echo "current SHA:         ${GITHUB_SHA}"
          if [[ -n "$last_sha" && "$last_sha" == "$GITHUB_SHA" ]]; then
            echo "No new commits since last nightly success — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # NOTE: the nightly `android-compile` (Android debug compile) job was removed
  # (issue #170 follow-up): it only duplicated ci.yml's per-PR `android-compile`
  # gate. The one niche it covered — fork-authored PRs, which ci.yml skips (no
  # secret access) — doesn't apply to this repo. The offline + release compile
  # jobs below are NOT covered elsewhere, so they stay.
  android-offline-compile:
    name: Android offline debug compile
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Compile offline Android debug
        run: ./gradlew :androidApp-offline:compileDebugSources --stacktrace

  android-release-compile:
    name: Android release compile (R8/minify)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    # The release variant is otherwise never built anywhere in CI (issue #171),
    # so minify/R8/ProGuard and release-google-services regressions ship
    # unnoticed until the first manual release. This nightly job assembles the
    # release APK — which runs R8 (minifyReleaseWithR8), resource shrinking, and
    # processReleaseGoogleServices — as the cheap "minimum" safety net.
    #
    # No signing secret needed: KmpAppConventionPlugin only wires a `release`
    # signingConfig when the RELEASE_STORE_* values are present, so on CI the
    # release build type has no signingConfig and produces an unsigned APK. The
    # Crashlytics mapping/native-symbol *uploads* are standalone tasks that
    # assembleRelease does not depend on, so nothing here touches the network or
    # needs Firebase credentials beyond the local google-services.json.
    #
    # Scope note (issue #171): the "maximum" — signing, versioning, and Play/
    # TestFlight upload — is deliberately out of scope. This job only compiles.

    steps:
      # Egress audit — see docs/security/ci-egress-hardening.md (issue #180).
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the release google-services.json is needed — processReleaseGoogle-
      # Services reads androidApp/src/release/google-services.json. Don't expose
      # the debug JSON or iOS plist to this job.
      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Assemble Android release (R8/minify, unsigned)
        run: ./gradlew :androidApp:assembleRelease --stacktrace


  ios-build:
    name: iOS simulator build
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    # Lean Debug build for iOS Simulator (arm64), no code signing, no archive,
    # no Crashlytics dSYM upload. Verifies the Kotlin framework links and the
    # Swift code compiles end-to-end against the embedded framework.

    steps:
      # Egress audit — see docs/security/ci-egress-hardening.md (issue #180).
      # macOS runner: audit mode is supported (logs egress only; no block).
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # iOS build only needs the GoogleService-Info.plist — don't expose the
      # Android secrets to this job. (Can't use require-all=true here: it
      # validates every input, not just the ones we passed.)
      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          ios-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      # Cache the Kotlin/Native toolchain (~/.konan) — setup-gradle doesn't
      # cover it, so the K/N compiler + platform libs re-download every run.
      - name: Cache Kotlin/Native (~/.konan)
        uses: ./.github/actions/konan-cache

      # Select the same Xcode the maestro-ios / ios-offline jobs use. The default
      # runner Xcode (16.4) ships an SDK too old for the Firebase SPM binary
      # frameworks + the app's newer-SDK symbols, so linking failed with
      # "framework 'FirebaseAuth' not found" / undefined _UIViewLayoutRegion. A
      # bare `xcodebuild -version` didn't pin the toolchain; select-xcode does.
      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # Pre-link the Kotlin framework for the simulator arch so the Xcode build
      # phase has its inputs ready and SPM resolution doesn't race with Gradle
      # on first run.
      - name: Link Kotlin framework (iosSimulatorArm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # Resolve a valid simulator *name* without booting one (a build needs the
      # device to exist, not to run) — same as ios-offline.yml. The named
      # destination pins a single concrete arch (arm64 on the runner); a
      # `generic/platform=iOS Simulator` destination instead builds every sim
      # arch and fails on x86_64, for which the Kotlin framework isn't linked
      # ("Unknown iOS simulator arch: 'x86_64'").
      - name: Resolve iOS simulator (no boot)
        id: ios-sim
        uses: ./.github/actions/ios-simulator
        with:
          boot: "false"

      # Reuse the exact build the maestro-ios job drives (qa.gradle.kts →
      # maestroBuildIosSimulator: -scheme iosApp, named -destination, a clean
      # -derivedDataPath, SKIP_CRASHLYTICS_UPLOAD=YES). Hand-rolling xcodebuild
      # here kept diverging from that proven recipe — nanopb build-dir collision,
      # x86_64 arch, and finally CODE_SIGNING_ALLOWED=NO breaking SwiftPM
      # framework linking ("framework 'FirebaseAuth' not found"). The gradle task
      # already links Firebase cleanly every night, so just call it.
      - name: Build iOS app (Simulator)
        run: |
          ./gradlew maestroBuildIosSimulator \
            -PiosSimulatorName="${{ steps.ios-sim.outputs.name }}" \
            --stacktrace

  # The offline iOS variant (composeAppOffline + iosAppOffline) is covered by
  # .github/workflows/ios-offline.yml on every PR and main push — building it
  # again here would be pure duplication, so nightly carries no
  # ios-offline-build job.

  maestro-android:
    name: Maestro Android (E2E)
    needs: decide
    if: needs.decide.outputs.run == 'true'
    # Non-blocking while issue #297 lands. The state of each workload:
    #   - qaAndroidDevice (instrumented sync tests): GREEN since #220 (stale
    #     off-by-one sync counts that never accounted for the workspace root doc,
    #     plus a @Before that initialised the *default* FirebaseApp without a
    #     Crashlytics build id).
    #   - qaMaestroOfflineAndroid (offline golden flow): was green, then started
    #     failing at a different step each night — bare `assertVisible` calls
    #     firing inside the window a write needs to land, and a Recent list the
    #     configurable-dashboard widgets (#282–296) pushed below the fold. Fixed
    #     in #297 with `extendedWaitUntil` / `scrollUntilVisible`.
    #   - qaMaestroAndroid (online E2E): was 19/19 red, every night, with the
    #     same two messages — not flake. Onboarding gates the startup route
    #     ahead of any session check (`AppLaunchViewModel`, #173) and no online
    #     flow walked it, so `01`/`16` asserted `signIn:root` on the welcome
    #     screen and everything chaining `00_login` lost `dashboard:settings`.
    #     The earlier note here blamed an app-side sign-in bug; the Auth
    #     emulator and the seeded credentials were never the problem.
    # The AVD is still reused between nights (booting one costs 5–8 min), but the
    # app is now uninstalled before it is installed, so the device no longer
    # carries state into a run that the Firebase emulator — always freshly empty
    # — knows nothing about.
    #
    # Drop `continue-on-error` after 2–3 consecutive green nights (#297).
    continue-on-error: true
    runs-on: ubuntu-latest
    # 120 (was 90): one AVD boot now hosts three workloads — online E2E (with a
    # single flake-guard retry), the offline golden flow, and the instrumented
    # device-test scope. Boot is the expensive part (~5–8 min), so co-locating
    # them here is far cheaper than three separate emulator sessions.
    timeout-minutes: 120
    permissions:
      contents: read
    # Heavy: builds debug APK with USE_EMULATOR=true, boots AVD + Firebase
    # Emulator (auth + firestore), seeds test users, runs all flows in
    # scripts/maestro/, generates Allure. Lives in nightly because the AVD
    # boot alone is ~5–8 min.

    steps:
      # Egress audit — see docs/security/ci-egress-hardening.md (issue #180).
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}

      # firebase-tools ≥14 ships a Firestore emulator JAR that needs JDK 21+.
      # Same caveat as the firestore-rules job in ci.yml.
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Set up Maestro + Allure + e2e creds
        uses: ./.github/actions/maestro-setup
        with:
          test-email:        ${{ secrets.E2E_TEST_EMAIL        || 'e2e+owner@test.local' }}
          test-password:     ${{ secrets.E2E_TEST_PASSWORD     || 'password' }}
          test-viewer-email: ${{ secrets.E2E_TEST_VIEWER_EMAIL || 'e2e+viewer@test.local' }}

      # Hardware acceleration for the AVD. The runner image ships KVM but the
      # default user isn't in the kvm group.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Everything that needs the AVD runs inside this single `script` — the
      # emulator only exists for the duration of the runner action, so online
      # E2E, the offline golden flow and the instrumented device tests all
      # share one boot. `overall` accumulates failures so a red flow doesn't
      # skip the later workloads (each still uploads its artifacts below).
      - name: Run E2E + device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          disable-spellchecker: true
          force-avd-creation: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          # android-emulator-runner runs this `script` via `sh -c` — /bin/sh is
          # dash on the ubuntu runner, which rejects `set -o pipefail` and
          # mis-parses a multi-line inlined body ("end of file unexpected
          # (expecting fi)"). Delegate to a committed bash script so the real
          # logic (functions, pipefail, retries) runs in bash, not dash.
          script: bash scripts/ci/nightly-android-e2e.sh

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-maestro-android
          path: build/reports/allure/maestro/
          if-no-files-found: warn
          retention-days: 14

      # Native Allure results — JSON test bodies, screenshots, executor metadata.
      # Consumed by the nightly-publish aggregator so the Pages report keeps
      # Maestro's per-step screenshots instead of degrading to bare JUnit.
      - name: Upload Allure results (native)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results-maestro-android
          path: build/allure-results/maestro/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-junit
          path: build/test-results/maestro/*.xml
          if-no-files-found: warn
          retention-days: 14

      # Instrumented device-test results (qaAndroidDevice, §5). Plugged-in-AVD
      # runs land under `<module>/build/outputs/androidTest-results/connected/…`;
      # the AGP-KMP `:integration-test` uses `androidMain/`. Not wired into the
      # Allure aggregate — kept as a raw-JUnit artifact for triage.
      - name: Upload Android device-test JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-device-junit
          path: "**/build/outputs/androidTest-results/**/*.xml"
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Maestro debug + screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-debug
          path: |
            build/maestro-debug/
            build/maestro-artifacts/
            build/logs/maestro/
          if-no-files-found: ignore
          retention-days: 7

  maestro-ios:
    name: Maestro iOS (E2E)
    needs: decide
    # RE-ENABLED (issue #297) with a much smaller scope: this job was turned off
    # because the 17-flow online suite was flaky (10/18 one night, a different
    # set of failures each run). `qaMaestroIos` now drives a single launch smoke
    # (scripts/maestro/ios/app-open.yaml: install → launch clean → onboarding
    # renders), which has no cross-flow state to leak and no navigation races —
    # so a red here is real signal again and blocks the nightly. The full suite
    # still runs on Android; `maestroRunAllIos` drives it locally on iOS.
    # Restoring it here means flipping the target in gradle/qa.gradle.kts back
    # to `scripts/maestro/` + the tag exclusions.
    if: needs.decide.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    # Same shape as maestro-android but on a macOS runner: boots an iPhone
    # simulator, builds the Debug app with MS_USE_EMULATOR=YES, runs flows.

    steps:
      # Egress audit — see docs/security/ci-egress-hardening.md (issue #180).
      # macOS runner: audit mode is supported (logs egress only; no block).
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          ios-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      # Cache the Kotlin/Native toolchain (~/.konan) that qaMaestroIos links —
      # setup-gradle doesn't cover it. macOS runner minutes.
      - name: Cache Kotlin/Native (~/.konan)
        uses: ./.github/actions/konan-cache

      - name: Set up Maestro + Allure + e2e creds
        uses: ./.github/actions/maestro-setup
        with:
          test-email:        ${{ secrets.E2E_TEST_EMAIL        || 'e2e+owner@test.local' }}
          test-password:     ${{ secrets.E2E_TEST_PASSWORD     || 'password' }}
          test-viewer-email: ${{ secrets.E2E_TEST_VIEWER_EMAIL || 'e2e+viewer@test.local' }}

      # Prints the selected version; replaces a bare `xcodebuild -version`.
      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Boot iOS simulator
        id: ios-sim
        uses: ./.github/actions/ios-simulator

      # macos-15 is the most expensive billing line, so a failed night here is
      # doubly costly — auto-retry the flow suite once to absorb simulator/E2E
      # flake before the run is written off.
      - name: Run qaMaestroIos
        env:
          # Maestro installs an XCUITest driver onto the simulator on first run;
          # on a cold CI simulator that install+launch routinely overruns
          # Maestro's default startup window, so the run aborts before any flow
          # ("IOSDriverTimeoutException: iOS driver not ready in time"). Give it
          # a generous ceiling — it's a one-time startup wait, not per-flow.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
        run: |
          set -uo pipefail
          run_ios() {
            ./gradlew qaMaestroIos \
              -PiosSimulatorName="${{ steps.ios-sim.outputs.name }}" \
              -PiosSimulatorUdid="${{ steps.ios-sim.outputs.udid }}" \
              --stacktrace
          }
          if ! run_ios; then
            echo "::warning title=E2E flake guard::qaMaestroIos failed — retrying once."
            run_ios
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report-maestro-ios
          path: build/reports/allure/maestro-ios/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure results (native)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results-maestro-ios
          path: build/allure-results/maestro-ios/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-ios-junit
          path: build/test-results/maestro-ios/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Maestro debug + screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-ios-debug
          path: |
            build/maestro-ios-debug/
            build/maestro-ios-artifacts/
            build/logs/maestro-ios/
          if-no-files-found: ignore
          retention-days: 7

  maestro-ios-offline:
    name: Maestro iOS offline (E2E)
    needs: decide
    # RE-ENABLED (issue #297): off while the E2E suites were being stabilized,
    # back on now that `qaMaestroOfflineIos` runs only the launch smoke (see the
    # scope note below and the sibling maestro-ios job).
    if: needs.decide.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    # The offline-iOS E2E run used to live in the per-PR ios-offline.yml. That
    # lane is now build-only (§4) — cheap enough to gate every PR — while the
    # simulator run moved here, next to the other nightly E2E jobs. Scope as of
    # #297: the launch smoke (scripts/maestro/ios/app-open.yaml), not the
    # offline golden path — that one still runs on Android.
    # No Firebase config on purpose: the offline app is fully network-free
    # (maestro-setup with online-stack=false installs only the Maestro CLI).

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      # Cache the Kotlin/Native toolchain (~/.konan) that the offline link step
      # below pulls — setup-gradle doesn't cover it. macOS runner minutes.
      - name: Cache Kotlin/Native (~/.konan)
        uses: ./.github/actions/konan-cache

      - name: Set up Maestro (offline — no Firebase/Allure)
        uses: ./.github/actions/maestro-setup
        with:
          online-stack: "false"

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # Pre-link the Kotlin framework for the simulator arch so the Xcode build
      # phase has its inputs ready and SPM resolution doesn't race with Gradle
      # on first run (same reasoning as the online iOS jobs).
      - name: Link Kotlin framework (iosSimulatorArm64, offline)
        run: ./gradlew :composeAppOffline:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Boot iOS simulator
        id: ios-sim
        uses: ./.github/actions/ios-simulator

      - name: Run qaMaestroOfflineIos
        run: |
          set -uo pipefail
          run_offline_ios() {
            ./gradlew qaMaestroOfflineIos \
              -PiosSimulatorName="${{ steps.ios-sim.outputs.name }}" \
              -PiosSimulatorUdid="${{ steps.ios-sim.outputs.udid }}" \
              --stacktrace
          }
          if ! run_offline_ios; then
            echo "::warning title=E2E flake guard::qaMaestroOfflineIos failed — retrying once."
            run_offline_ios
          fi

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-ios-offline-junit
          path: build/test-results/maestro-ios/*.xml
          if-no-files-found: warn
          retention-days: 14

      # Offline tasks use buildMaestroCommand's default debug/artifact dirs
      # (build/maestro-debug, build/maestro-artifacts) — not the -ios-suffixed
      # dirs of the online suite.
      - name: Upload Maestro debug + screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-ios-offline-debug
          path: |
            build/maestro-debug/
            build/maestro-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  nightly-publish:
    name: Aggregate + publish nightly to Pages
    needs: [decide, maestro-android, maestro-ios, maestro-ios-offline]
    # DISABLED (issue #297): this job only aggregates the Maestro Allure
    # results, and it was switched off while those jobs were.
    #
    # That rationale is now stale: maestro-android, maestro-ios and
    # maestro-ios-offline all run again under the ordinary
    # `needs.decide.outputs.run == 'true'` gate (quarantined and
    # `continue-on-error`, but scheduled), so the aggregate would no longer be
    # empty. Re-enabling is a judgement call about publishing a knowingly-red
    # suite, not a blocked dependency — flip back to
    # `always() && needs.decide.outputs.run == 'true'` when that call is made.
    #
    # Until then /nightly/allure/ on Pages stays frozen on the last published
    # run, and the report_url fix below is dormant. README's Reports section
    # flags the link as stale to match.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Share the gh-pages writer lock with ci.yml `publish` and gh-pages-prune so
    # cross-workflow pushes serialize instead of racing into non-fast-forwards.
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      # Prefer the native Allure results (JSON + screenshots) so the published
      # report keeps Maestro per-step UI evidence. Fall back to JUnit XML when
      # the native artifact is missing — happens if the prep task crashed *and*
      # never managed to write `executor.json` (extremely rare given the
      # in-Gradle fallback in qa.gradle.kts → writeAllureFallbackMetadata).
      - name: Download Maestro Android Allure results (native)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: allure-results-maestro-android
          path: allure-input-native/maestro-android
        continue-on-error: true

      - name: Download Maestro iOS Allure results (native)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: allure-results-maestro-ios
          path: allure-input-native/maestro-ios
        continue-on-error: true

      - name: Download Maestro Android JUnit (fallback)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maestro-android-junit
          path: allure-input/maestro-android
        continue-on-error: true

      - name: Download Maestro iOS JUnit (fallback)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maestro-ios-junit
          path: allure-input/maestro-ios
        continue-on-error: true

      # Offline iOS has no native Allure (online-stack=false → no converter),
      # so it only ever contributes JUnit XML. Its own `allure-input/…` subdir
      # means the native-data guard below never suppresses it.
      - name: Download Maestro iOS offline JUnit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maestro-ios-offline-junit
          path: allure-input/maestro-ios-offline
        continue-on-error: true

      - name: Stage Allure results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p allure-results
          # 1) Native Allure: copy result.json bodies + attachment binaries
          #    verbatim. Filenames are uuid4-based (per maestro_to_allure.py)
          #    so they cannot collide across Android/iOS scopes.
          #
          #    `executor.json` and `environment.properties` are intentionally
          #    skipped: the converter writes them per scope, but flattening
          #    into one dir would silently overwrite one scope's metadata with
          #    the other's. Per-scope copies remain available in the
          #    `allure-results-maestro-{android,ios}` artifacts for anyone
          #    debugging the converter output.
          if [ -d allure-input-native ]; then
            find allure-input-native -type f 2>/dev/null | while read -r f; do
              base="$(basename "$f")"
              case "$base" in
                executor.json|environment.properties) continue ;;
              esac
              cp "$f" "allure-results/$base"
            done
          fi
          native_count=$(find allure-results -type f 2>/dev/null | wc -l)
          # 2) JUnit fallback: only stage XMLs we don't already have native
          #    data for. Treat presence of any `*-result.json` for a scope as
          #    "native data is here" and skip its JUnit to avoid duplicate
          #    suites. Guarded by `[ -d allure-input ]` because both fallback
          #    downloads use `continue-on-error: true` and may leave the dir
          #    absent — `find` on a missing path would otherwise abort the
          #    whole job under `set -e`.
          have_android_native=false; have_ios_native=false
          if compgen -G "allure-input-native/maestro-android/*-result.json" > /dev/null; then
            have_android_native=true
          fi
          if compgen -G "allure-input-native/maestro-ios/*-result.json" > /dev/null; then
            have_ios_native=true
          fi
          if [ -d allure-input ]; then
            find allure-input -type f -name '*.xml' 2>/dev/null | while read -r f; do
              case "$f" in
                allure-input/maestro-android/*) $have_android_native && continue ;;
                allure-input/maestro-ios/*)     $have_ios_native     && continue ;;
              esac
              dest="allure-results/$(echo "${f#allure-input/}" | tr '/' '__')"
              cp "$f" "$dest"
            done
          fi
          total=$(find allure-results -type f 2>/dev/null | wc -l)
          echo "Staged $total input(s) ($native_count native, $((total - native_count)) JUnit fallback)."

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Ensure gh-pages dir exists
        shell: bash
        # ALLURE_REPORT_URL is derived here rather than from
        # `github.event.repository.name`, which a `schedule` payload need not
        # carry. See the report_url note below.
        run: |
          set -euo pipefail
          mkdir -p gh-pages/nightly/allure
          echo "ALLURE_REPORT_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY##*/}/nightly/allure" >> "$GITHUB_ENV"

      - name: Build Allure report (with history)
        uses: simple-elf/allure-report-action@385367cde61ac68c2568a117f7579f7f148dc459 # v1.15
        with:
          allure_results: allure-results
          gh_pages: gh-pages/nightly/allure
          allure_report: allure-report
          allure_history: allure-history
          # Same reason as ci.yml's publish job: without report_url the redirect
          # stub and executor.json point at the Pages root instead of this
          # subtree, so opening /nightly/allure/ lands on a 404.
          report_url: ${{ env.ALLURE_REPORT_URL }}
          # Cap the generated history payload to the 20 most recent reports.
          # keep_files: true below never deletes already-published run-number
          # dirs, so the weekly gh-pages-prune.yml does the actual branch
          # trimming of the nightly/allure subtree.
          keep_reports: 20

      - name: Assemble Pages payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/nightly/allure
          if [[ -d allure-history ]]; then
            cp -r allure-history/. public/nightly/allure/
          fi

      # keep_files: true preserves the per-push /allure/ + /kover/ subtrees
      # that the ci.yml `publish` job manages independently.
      - name: Deploy to gh-pages (/nightly/)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          commit_message: "docs(ci): nightly reports for ${{ github.sha }}"

  # Nightly is the only place E2E + iOS-online are exercised, and the default
  # GitHub failure email is easy to miss — a missed red night = a lost day of
  # signal. File (or comment on) a tracking issue so failures surface in the
  # repo's issue list. `contains(needs.*.result, 'failure')` fires on any real
  # job failure (not on cancels or the skip path).
  notify-failure:
    name: Open/update tracking issue on failure
    needs:
      - decide
      - android-offline-compile
      - android-release-compile
      - ios-build
      - maestro-android
      - maestro-ios
      - maestro-ios-offline
      - nightly-publish
    if: >-
      always() &&
      needs.decide.outputs.run == 'true' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create or update nightly-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEEDS_JSON: ${{ toJson(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Markdown bullet list of the jobs that ended in `failure`.
          failed=$(python3 <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          for name, data in sorted(needs.items()):
              if data.get("result") == "failure":
                  print(f"- `{name}`")
          PY
          )
          if [ -z "$failed" ]; then
            echo "No job reported 'failure' — nothing to file."
            exit 0
          fi

          label="nightly-failure"
          # Idempotent: --force updates the label if it already exists.
          gh label create "$label" --color B60205 \
            --description "Automated tracking issue for nightly CI failures" \
            --force >/dev/null 2>&1 || true

          body=$(printf '%s\n' \
            "The [nightly run]($RUN_URL) failed for commit \`$RUN_SHA\`." \
            "" \
            "**Failed jobs:**" \
            "$failed" \
            "" \
            "_Filed automatically by nightly.yml. Reused across nights while open — a new comment is added each time nightly fails. Close it once green._")

          # Reuse the newest open tracking issue if any; otherwise open one.
          existing=$(gh issue list --state open --label "$label" \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Commenting on existing tracking issue #$existing."
            gh issue comment "$existing" --body "$body"
          else
            echo "Opening new tracking issue."
            gh issue create --title "🌙 Nightly failure" --label "$label" --body "$body"
          fi
