name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  junit:
    name: JUnit + Allure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Allure CLI
        shell: bash
        run: |
          set -euo pipefail
          ALLURE_VERSION=2.34.1
          curl -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Run JUnit tests
        run: ./gradlew qaCommon --stacktrace

      - name: Write JUnit + Allure summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import html
          import xml.etree.ElementTree as ET

          files = sorted(Path(".").glob("*/build/test-results/jvmTest/*.xml"))

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "time": 0.0}
          modules = {}
          failed_cases = []

          for file in files:
              module = file.parts[0]
              try:
                  root = ET.parse(file).getroot()
              except ET.ParseError:
                  continue

              tests = int(root.attrib.get("tests", 0))
              failures = int(root.attrib.get("failures", 0))
              errors = int(root.attrib.get("errors", 0))
              skipped = int(root.attrib.get("skipped", 0))
              duration = float(root.attrib.get("time", 0.0))

              row = modules.setdefault(
                  module,
                  {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "time": 0.0},
              )
              for key, value in {
                  "tests": tests,
                  "failures": failures,
                  "errors": errors,
                  "skipped": skipped,
                  "time": duration,
              }.items():
                  totals[key] += value
                  row[key] += value

              for case in root.findall("testcase"):
                  has_failure = case.find("failure") is not None
                  has_error = case.find("error") is not None
                  if has_failure or has_error:
                      failed_cases.append(
                          f"{module}: {case.attrib.get('classname', '')}.{case.attrib.get('name', '')}"
                      )

          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          outcome = "✅" if totals["failures"] == 0 and totals["errors"] == 0 else "❌"

          print("## JUnit + Allure summary")
          print()
          if not files:
              print("No JUnit XML files found at `*/build/test-results/jvmTest/*.xml`.")
              raise SystemExit

          print("| Scope | Tests | Passed | Failed | Errors | Skipped | Time |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          print(
              f"| qaCommon {outcome} | {totals['tests']} | {passed} | "
              f"{totals['failures']} | {totals['errors']} | {totals['skipped']} | "
              f"{totals['time']:.1f}s |"
          )
          print()

          print("| Module | Tests | Failed | Errors | Skipped | Time |")
          print("|---|---:|---:|---:|---:|---:|")
          for module, row in sorted(modules.items()):
              print(
                  f"| `{module}` | {row['tests']} | {row['failures']} | "
                  f"{row['errors']} | {row['skipped']} | {row['time']:.1f}s |"
              )

          print()
          print("- Allure report artifact: `allure-report-common`")
          print("- JUnit XML artifact: `junit-results`")

          if failed_cases:
              print()
              print("<details>")
              print("<summary>Failed test cases</summary>")
              print()
              for case in failed_cases[:30]:
                  print(f"- `{html.escape(case)}`")
              if len(failed_cases) > 30:
                  print(f"- ... and {len(failed_cases) - 30} more")
              print()
              print("</details>")
          PY

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-common
          path: build/reports/allure/common/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: "**/build/test-results/jvmTest/**/*.xml"
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Kover HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html
          path: build/reports/kover/html/
          if-no-files-found: warn
          retention-days: 14

  android-compile:
    name: Android debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PRs from forks don't get repo secrets, so the google-services step below
    # would fail. Skip the job in that case — qaCommon already covers the PR.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compile-only: catches AGP/Kotlin/google-services regressions without
      # needing the dev keystore (assembleDebug would require DEV_* secrets,
      # see androidApp/build.gradle.kts → signingConfigs.dev).
      - name: Compile Android debug
        run: ./gradlew :androidApp:processDebugGoogleServices :androidApp:compileDebugSources --stacktrace

  firestore-rules:
    name: Firestore rules (Mocha + Allure)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Standalone: uses fake `demo-moneysurfer` project against the local
    # Firestore emulator, so no Firebase secrets needed (runs on fork PRs too).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # firebase-tools ≥14 requires JDK 21+ (the Firestore emulator JAR no
      # longer runs on 17). Other CI jobs stay on 17 — only this job needs 21.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install firebase-tools
        run: npm i -g firebase-tools

      - name: Install firestore-tests deps
        working-directory: firestore-tests
        run: npm ci

      - name: Install Allure CLI
        shell: bash
        run: |
          set -euo pipefail
          ALLURE_VERSION=2.34.1
          curl -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Run Mocha Firestore-rules tests
        run: ./gradlew qaFirestoreRules --stacktrace

      - name: Write Mocha + Allure summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import html
          import xml.etree.ElementTree as ET

          junit = Path("build/test-results/firestore/firestore-report.xml")

          print("## Firestore rules — Mocha + Allure")
          print()
          if not junit.exists():
              print(f"No JUnit XML found at `{junit}`.")
              raise SystemExit

          try:
              root = ET.parse(junit).getroot()
          except ET.ParseError as exc:
              print(f"Could not parse `{junit}`: {exc}")
              raise SystemExit

          # mocha-junit-reporter wraps everything in a <testsuites> with per-describe
          # <testsuite> children. Aggregate across all of them.
          suites = root.findall("testsuite") or [root]
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "time": 0.0}
          failed_cases = []
          for suite in suites:
              totals["tests"] += int(suite.attrib.get("tests", 0))
              totals["failures"] += int(suite.attrib.get("failures", 0))
              totals["errors"] += int(suite.attrib.get("errors", 0))
              totals["skipped"] += int(suite.attrib.get("skipped", 0))
              totals["time"] += float(suite.attrib.get("time", 0.0))
              for case in suite.findall("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed_cases.append(
                          f"{case.attrib.get('classname', '')}.{case.attrib.get('name', '')}"
                      )

          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          outcome = "✅" if totals["failures"] == 0 and totals["errors"] == 0 else "❌"

          print("| Suite | Tests | Passed | Failed | Errors | Skipped | Time |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          print(
              f"| qaFirestoreRules {outcome} | {totals['tests']} | {passed} | "
              f"{totals['failures']} | {totals['errors']} | {totals['skipped']} | "
              f"{totals['time']:.1f}s |"
          )
          print()
          print("- Allure report artifact: `allure-report-firestore`")
          print("- JUnit XML artifact: `firestore-junit-results`")

          if failed_cases:
              print()
              print("<details>")
              print("<summary>Failed test cases</summary>")
              print()
              for case in failed_cases[:30]:
                  print(f"- `{html.escape(case)}`")
              if len(failed_cases) > 30:
                  print(f"- ... and {len(failed_cases) - 30} more")
              print()
              print("</details>")
          PY

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-firestore
          path: build/reports/allure/firestore/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-junit-results
          path: build/test-results/firestore/*.xml
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Aggregate + publish to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [junit, firestore-rules]
    if: always()
    permissions:
      contents: write

    steps:
      - name: Download JUnit (common)
        uses: actions/download-artifact@v4
        with:
          name: junit-results
          path: allure-input/common
        continue-on-error: true

      - name: Download JUnit (firestore)
        uses: actions/download-artifact@v4
        with:
          name: firestore-junit-results
          path: allure-input/firestore
        continue-on-error: true

      - name: Download Kover HTML
        uses: actions/download-artifact@v4
        with:
          name: kover-html
          path: kover-html
        continue-on-error: true

      # Flatten JUnit XMLs into a single dir so simple-elf gets a clean
      # `allure_results` input. We keep one XML per file; nested layouts from
      # different jobs are squashed by prefixing with their source path.
      - name: Stage Allure results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p allure-results
          if compgen -G "allure-input/**/*.xml" > /dev/null; then
            find allure-input -type f -name '*.xml' | while read -r f; do
              # Replace path separators with '__' to keep filenames unique.
              dest="allure-results/$(echo "${f#allure-input/}" | tr '/' '__')"
              cp "$f" "$dest"
            done
          fi
          echo "Staged $(ls allure-results 2>/dev/null | wc -l) XML(s)."

      # Decide whether this run publishes to Pages. PRs (especially from forks)
      # don't get write access to gh-pages, and the branch protection on main is
      # the right gate for what becomes "the" public report.
      - name: Should publish to Pages?
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "publish=true"  >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Pages-only path below ---------------------------------------------

      # simple-elf reads existing history from a checked-out gh-pages clone.
      # First-ever run: branch may not exist; continue-on-error and we fall
      # back to an empty history dir so the action still produces a report.
      - name: Checkout gh-pages
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Ensure gh-pages dir exists
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: mkdir -p gh-pages/allure

      - name: Build Allure report (with history)
        if: steps.gate.outputs.publish == 'true'
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages/allure
          allure_report: allure-report
          allure_history: allure-history

      - name: Assemble Pages payload
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/allure public/kover
          # simple-elf writes the merged report+history tree into allure-history/
          if [[ -d allure-history ]]; then
            cp -r allure-history/. public/allure/
          fi
          if [[ -d kover-html ]]; then
            cp -r kover-html/. public/kover/
          fi
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>MoneySurfer reports</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1.5rem; color: #222; }
              h1 { font-size: 1.5rem; }
              ul { line-height: 1.9; }
              code { background: #f3f3f3; padding: 0 .25rem; border-radius: 3px; }
              .muted { color: #777; font-size: .9rem; }
            </style>
          </head>
          <body>
            <h1>MoneySurfer — CI reports</h1>
            <p class="muted">Published from <code>main</code> on every push.</p>
            <h2>Push (common + firestore)</h2>
            <ul>
              <li><a href="allure/">Allure</a> (with history)</li>
              <li><a href="kover/">Kover coverage</a> (common scope)</li>
            </ul>
            <h2>Nightly (all five scopes)</h2>
            <ul>
              <li><a href="nightly/allure/">Allure</a></li>
              <li><a href="nightly/kover/">Kover coverage</a> (combined)</li>
            </ul>
          </body>
          </html>
          HTML

      # keep_files: true preserves the nightly/ subtree pushed by the nightly
      # workflow; we only overwrite allure/, kover/, and index.html.
      - name: Deploy to gh-pages
        if: steps.gate.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          commit_message: "docs(ci): publish push reports for ${{ github.sha }}"

      # PR / non-main runs still get an artifact so reviewers can download the
      # aggregated Allure without waiting for Pages.
      - name: Generate aggregated Allure (artifact only)
        if: steps.gate.outputs.publish != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ALLURE_VERSION=2.34.1
          curl -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "${RUNNER_TEMP}"
          export PATH="${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin:$PATH"
          if [[ -z "$(ls -A allure-results 2>/dev/null)" ]]; then
            echo "No Allure results staged; skipping." >&2
            exit 0
          fi
          mkdir -p build/reports/allure/all
          allure generate allure-results -o build/reports/allure/all --clean

      - name: Upload aggregated Allure (PR/non-main)
        if: steps.gate.outputs.publish != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-all
          path: build/reports/allure/all/
          if-no-files-found: warn
          retention-days: 14

  # iOS build is intentionally not wired up yet — macos-14 runners are ~10x more
  # expensive than ubuntu-latest and the Android compile job catches most
  # regressions in shared/composeApp/feature modules. To enable, add:
  #   ios-build:
  #     runs-on: macos-14
  #     if: >-
  #       github.event_name == 'push' ||
  #       github.event.pull_request.head.repo.full_name == github.repository
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: ./.github/actions/firebase-config
  #         with:
  #           ios-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
  #       - uses: actions/setup-java@v4
  #         with: { distribution: temurin, java-version: "17" }
  #       - uses: gradle/actions/setup-gradle@v4
  #       - run: ./gradlew :composeApp:linkPodReleaseFrameworkIosArm64
