name: PR checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap fan-out gate so doc-only / AI-tooling PRs don't pay for a full
  # Gradle compile while still reporting status checks (top-level
  # `paths-ignore` would skip the workflow entirely and stall any required
  # check in branch protection). The ignore list lives here — single source
  # of truth for PR and manual runs.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # `**` matches everything; subsequent `!`-patterns subtract docs and
          # AI-tooling. `code` is true iff at least one changed file remains.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.agents/**'
              - '!ai/**'
              - '!md/**'
              - '!docs/**'
              - '!.github/copilot-instructions.md'
              - '!LICENSE'

  junit:
    name: JUnit + Allure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Allure CLI
        shell: bash
        run: |
          set -euo pipefail
          ALLURE_VERSION=2.34.1
          curl -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "${GITHUB_PATH}"

      # Copy-paste detection gate. Fast (tokenize-only, no compile) and blocking
      # (`ignoreFailures = false`): fails the PR on new Kotlin duplication before
      # the slower test run. Same engine/threshold SonarCloud uses.
      - name: Run CPD duplication gate
        run: ./gradlew cpdCheck --stacktrace

      - name: Upload CPD report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cpd-report
          path: build/reports/cpd/
          if-no-files-found: ignore

      # qaCommon = common (JVM) scope; qaAndroidHost = Android host/unit scope
      # (kotest on the JVM, no device). Host tests are cheap on ubuntu and were
      # previously run nowhere in CI (issue #172 §5) — one invocation keeps the
      # shared Kover report from running twice. A red test in either scope fails
      # the job.
      - name: Run JUnit tests (common + Android host)
        run: ./gradlew qaCommon qaAndroidHost --stacktrace

      - name: Write JUnit + Allure summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import html
          import xml.etree.ElementTree as ET

          files = sorted(Path(".").glob("*/build/test-results/jvmTest/*.xml"))

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "time": 0.0}
          modules = {}
          failed_cases = []

          for file in files:
              module = file.parts[0]
              try:
                  root = ET.parse(file).getroot()
              except ET.ParseError:
                  continue

              tests = int(root.attrib.get("tests", 0))
              failures = int(root.attrib.get("failures", 0))
              errors = int(root.attrib.get("errors", 0))
              skipped = int(root.attrib.get("skipped", 0))
              duration = float(root.attrib.get("time", 0.0))

              row = modules.setdefault(
                  module,
                  {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "time": 0.0},
              )
              for key, value in {
                  "tests": tests,
                  "failures": failures,
                  "errors": errors,
                  "skipped": skipped,
                  "time": duration,
              }.items():
                  totals[key] += value
                  row[key] += value

              for case in root.findall("testcase"):
                  has_failure = case.find("failure") is not None
                  has_error = case.find("error") is not None
                  if has_failure or has_error:
                      failed_cases.append(
                          f"{module}: {case.attrib.get('classname', '')}.{case.attrib.get('name', '')}"
                      )

          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          outcome = "✅" if totals["failures"] == 0 and totals["errors"] == 0 else "❌"

          print("## JUnit + Allure summary")
          print()
          if not files:
              print("No JUnit XML files found at `*/build/test-results/jvmTest/*.xml`.")
              raise SystemExit

          print("| Scope | Tests | Passed | Failed | Errors | Skipped | Time |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          print(
              f"| qaCommon {outcome} | {totals['tests']} | {passed} | "
              f"{totals['failures']} | {totals['errors']} | {totals['skipped']} | "
              f"{totals['time']:.1f}s |"
          )
          print()

          print("| Module | Tests | Failed | Errors | Skipped | Time |")
          print("|---|---:|---:|---:|---:|---:|")
          for module, row in sorted(modules.items()):
              print(
                  f"| `{module}` | {row['tests']} | {row['failures']} | "
                  f"{row['errors']} | {row['skipped']} | {row['time']:.1f}s |"
              )

          print()
          print("- Allure report artifact: `allure-report-common`")
          print("- JUnit XML artifact: `junit-results`")

          if failed_cases:
              print()
              print("<details>")
              print("<summary>Failed test cases</summary>")
              print()
              for case in failed_cases[:30]:
                  print(f"- `{html.escape(case)}`")
              if len(failed_cases) > 30:
                  print(f"- ... and {len(failed_cases) - 30} more")
              print()
              print("</details>")
          PY

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-common
          path: build/reports/allure/common/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: "**/build/test-results/jvmTest/**/*.xml"
          if-no-files-found: warn
          retention-days: 14

      # Android host-scope JUnit lands under testAndroidHostTest/, separate from
      # the jvmTest glob above. Kept as a standalone artifact for triage.
      - name: Upload Android host JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-host-junit
          path: "**/build/test-results/testAndroidHostTest/**/*.xml"
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Kover HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-html
          path: build/reports/kover/html/
          if-no-files-found: warn
          retention-days: 14

      # Codecov upload requires CODECOV_TOKEN, which fork PRs don't get and
      # which isn't provisioned until repo admin completes the Codecov setup
      # (see codecov.yml). Guard like the firebase-config caller pattern so a
      # missing secret or fork PR doesn't turn `junit` red.
      - name: Check Codecov token
        if: always()
        id: codecov_token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        if: >-
          always() &&
          steps.codecov_token.outputs.present == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          flags: unittests
          fail_ci_if_error: false
          disable_search: true

      - name: Upload test results to Codecov
        if: >-
          always() &&
          steps.codecov_token.outputs.present == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/build/test-results/jvmTest/**/*.xml"
          flags: unittests
          report_type: test_results
          fail_ci_if_error: false
          disable_search: true

  firestore-rules:
    name: Firestore rules (Mocha + Allure)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Standalone: uses fake `demo-moneysurfer` project against the local
    # Firestore emulator, so no Firebase secrets needed (runs on fork PRs too).
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # firebase-tools ≥14 requires JDK 21+ (the Firestore emulator JAR no
      # longer runs on 17). Other CI jobs stay on 17 — only this job needs 21.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install Firebase CLI
        uses: ./.github/actions/firebase-tools

      - name: Install firestore-tests deps
        working-directory: firestore-tests
        run: npm ci

      - name: Install Allure CLI
        shell: bash
        run: |
          set -euo pipefail
          ALLURE_VERSION=2.34.1
          curl -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Run Mocha Firestore-rules tests
        run: ./gradlew qaFirestoreRules --stacktrace

      - name: Write Mocha + Allure summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import html
          import xml.etree.ElementTree as ET

          junit = Path("build/test-results/firestore/firestore-report.xml")

          print("## Firestore rules — Mocha + Allure")
          print()
          if not junit.exists():
              print(f"No JUnit XML found at `{junit}`.")
              raise SystemExit

          try:
              root = ET.parse(junit).getroot()
          except ET.ParseError as exc:
              print(f"Could not parse `{junit}`: {exc}")
              raise SystemExit

          # mocha-junit-reporter wraps everything in a <testsuites> with per-describe
          # <testsuite> children. Aggregate across all of them.
          suites = root.findall("testsuite") or [root]
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "time": 0.0}
          failed_cases = []
          for suite in suites:
              totals["tests"] += int(suite.attrib.get("tests", 0))
              totals["failures"] += int(suite.attrib.get("failures", 0))
              totals["errors"] += int(suite.attrib.get("errors", 0))
              totals["skipped"] += int(suite.attrib.get("skipped", 0))
              totals["time"] += float(suite.attrib.get("time", 0.0))
              for case in suite.findall("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed_cases.append(
                          f"{case.attrib.get('classname', '')}.{case.attrib.get('name', '')}"
                      )

          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          outcome = "✅" if totals["failures"] == 0 and totals["errors"] == 0 else "❌"

          print("| Suite | Tests | Passed | Failed | Errors | Skipped | Time |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          print(
              f"| qaFirestoreRules {outcome} | {totals['tests']} | {passed} | "
              f"{totals['failures']} | {totals['errors']} | {totals['skipped']} | "
              f"{totals['time']:.1f}s |"
          )
          print()
          print("- Allure report artifact: `allure-report-firestore`")
          print("- JUnit XML artifact: `firestore-junit-results`")

          if failed_cases:
              print()
              print("<details>")
              print("<summary>Failed test cases</summary>")
              print()
              for case in failed_cases[:30]:
                  print(f"- `{html.escape(case)}`")
              if len(failed_cases) > 30:
                  print(f"- ... and {len(failed_cases) - 30} more")
              print()
              print("</details>")
          PY

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-firestore
          path: build/reports/allure/firestore/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firestore-junit-results
          path: build/test-results/firestore/*.xml
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: Send analysis to SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    # Skip on PRs from forks (no SONAR_TOKEN access from fork secrets) and
    # on doc-only changes (see `changes` job).
    if: >-
      (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Sonar needs full git history for blame/new-code detection.
          fetch-depth: 0

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # detekt may fail (violations beyond baseline) but we still want its XML
      # reports for Sonar to ingest, and we don't want it to block analysis
      # publication. Quality-gate enforcement lives on the SonarCloud side.
      - name: Run detekt
        continue-on-error: true
        run: ./gradlew detekt --stacktrace --continue

      - name: Run Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --stacktrace

  detekt:
    name: detekt (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    # The `sonar` job also runs detekt, but with continue-on-error so its XML
    # still reaches SonarCloud even on violations — enforcement is delegated to
    # the Sonar quality gate. A contributor on plain git (not the Claude
    # /detekt workflow) can push violations that only surface at the Sonar gate
    # (issue #172 §3). This job is the hard gate: plain `./gradlew detekt`
    # (source-only, no type-resolution classpath, so no SDK/compile needed)
    # blocks the PR the moment a violation lands.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run detekt
        run: ./gradlew detekt --stacktrace

      - name: Upload detekt reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: "**/build/reports/detekt/*.xml"
          if-no-files-found: ignore
          retention-days: 14


  publish:
    name: Aggregate + publish to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, junit, firestore-rules]
    # Skip on doc-only PRs — no fresh test results to aggregate, and we don't
    # want to overwrite gh-pages with an empty Allure for a docs change.
    # `always()` so we still publish when individual test jobs go red.
    if: >-
      always() &&
      (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    steps:
      - name: Download JUnit (common)
        uses: actions/download-artifact@v8
        with:
          name: junit-results
          path: allure-input/common
        continue-on-error: true

      - name: Download JUnit (firestore)
        uses: actions/download-artifact@v8
        with:
          name: firestore-junit-results
          path: allure-input/firestore
        continue-on-error: true

      - name: Download Kover HTML
        uses: actions/download-artifact@v8
        with:
          name: kover-html
          path: kover-html
        continue-on-error: true

      # Flatten JUnit XMLs into a single dir so simple-elf gets a clean
      # `allure_results` input. We keep one XML per file; nested layouts from
      # different jobs are squashed by prefixing with their source path.
      - name: Stage Allure results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p allure-results
          # find returns 0 even with no matches — let the loop body simply not
          # execute. Avoids relying on `shopt -s globstar` for `**` glob support.
          find allure-input -type f -name '*.xml' 2>/dev/null | while read -r f; do
            dest="allure-results/$(echo "${f#allure-input/}" | tr '/' '__')"
            cp "$f" "$dest"
          done
          echo "Staged $(ls allure-results 2>/dev/null | wc -l) XML(s)."

      # Decide whether this run publishes to Pages. PRs (especially from forks)
      # don't get write access to gh-pages, and the branch protection on main is
      # the right gate for what becomes "the" public report.
      - name: Should publish to Pages?
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "publish=true"  >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Pages-only path below ---------------------------------------------

      # simple-elf reads existing history from a checked-out gh-pages clone.
      # First-ever run: branch may not exist; continue-on-error and we fall
      # back to an empty history dir so the action still produces a report.
      - name: Checkout gh-pages
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Ensure gh-pages dir exists
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: mkdir -p gh-pages/allure

      - name: Build Allure report (with history)
        if: steps.gate.outputs.publish == 'true'
        uses: simple-elf/allure-report-action@e463a472d3b1d750f9544369d60589ff1964c820 # v1.14
        with:
          allure_results: allure-results
          gh_pages: gh-pages/allure
          allure_report: allure-report
          allure_history: allure-history

      - name: Assemble Pages payload
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/allure public/kover
          if [[ -d allure-history ]]; then
            cp -r allure-history/. public/allure/
          fi
          if [[ -d kover-html ]]; then
            cp -r kover-html/. public/kover/
          fi
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>MoneySurfer reports</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1.5rem; color: #222; }
              h1 { font-size: 1.5rem; }
              ul { line-height: 1.9; }
              code { background: #f3f3f3; padding: 0 .25rem; border-radius: 3px; }
              .muted { color: #777; font-size: .9rem; }
            </style>
          </head>
          <body>
            <h1>MoneySurfer — CI reports</h1>
            <p class="muted">Published from <code>main</code> on every push.</p>
            <h2>Push (common + firestore)</h2>
            <ul>
              <li><a href="allure/">Allure</a> (with history)</li>
              <li><a href="kover/">Kover coverage</a> (common scope)</li>
            </ul>
            <h2>Nightly (all five scopes)</h2>
            <ul>
              <li><a href="nightly/allure/">Allure</a></li>
              <li><a href="nightly/kover/">Kover coverage</a> (combined)</li>
            </ul>
          </body>
          </html>
          HTML

      # keep_files: true preserves the nightly/ subtree pushed by the nightly
      # workflow; we only overwrite allure/, kover/, and index.html.
      - name: Deploy to gh-pages
        if: steps.gate.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          commit_message: "docs(ci): publish push reports for ${{ github.sha }}"

      # PR / non-main runs still get an artifact so reviewers can download the
      # aggregated Allure without waiting for Pages.
      - name: Generate aggregated Allure (artifact only)
        if: steps.gate.outputs.publish != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ALLURE_VERSION=2.34.1
          curl -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "${RUNNER_TEMP}"
          export PATH="${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin:$PATH"
          if [[ -z "$(ls -A allure-results 2>/dev/null)" ]]; then
            echo "No Allure results staged; skipping." >&2
            exit 0
          fi
          mkdir -p build/reports/allure/all
          allure generate allure-results -o build/reports/allure/all --clean

      - name: Upload aggregated Allure (PR/non-main)
        if: steps.gate.outputs.publish != 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-all
          path: build/reports/allure/all/
          if-no-files-found: warn
          retention-days: 14
