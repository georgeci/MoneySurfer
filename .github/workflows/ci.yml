name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  junit:
    name: JUnit + Allure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Allure CLI
        shell: bash
        run: |
          set -euo pipefail
          ALLURE_VERSION=2.34.1
          curl -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Run JUnit tests
        run: ./gradlew qaCommon --stacktrace

      - name: Write JUnit + Allure summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import html
          import xml.etree.ElementTree as ET

          files = sorted(Path(".").glob("*/build/test-results/jvmTest/*.xml"))

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "time": 0.0}
          modules = {}
          failed_cases = []

          for file in files:
              module = file.parts[0]
              try:
                  root = ET.parse(file).getroot()
              except ET.ParseError:
                  continue

              tests = int(root.attrib.get("tests", 0))
              failures = int(root.attrib.get("failures", 0))
              errors = int(root.attrib.get("errors", 0))
              skipped = int(root.attrib.get("skipped", 0))
              duration = float(root.attrib.get("time", 0.0))

              row = modules.setdefault(
                  module,
                  {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "time": 0.0},
              )
              for key, value in {
                  "tests": tests,
                  "failures": failures,
                  "errors": errors,
                  "skipped": skipped,
                  "time": duration,
              }.items():
                  totals[key] += value
                  row[key] += value

              for case in root.findall("testcase"):
                  has_failure = case.find("failure") is not None
                  has_error = case.find("error") is not None
                  if has_failure or has_error:
                      failed_cases.append(
                          f"{module}: {case.attrib.get('classname', '')}.{case.attrib.get('name', '')}"
                      )

          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          outcome = "✅" if totals["failures"] == 0 and totals["errors"] == 0 else "❌"

          print("## JUnit + Allure summary")
          print()
          if not files:
              print("No JUnit XML files found at `*/build/test-results/jvmTest/*.xml`.")
              raise SystemExit

          print("| Scope | Tests | Passed | Failed | Errors | Skipped | Time |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          print(
              f"| qaCommon {outcome} | {totals['tests']} | {passed} | "
              f"{totals['failures']} | {totals['errors']} | {totals['skipped']} | "
              f"{totals['time']:.1f}s |"
          )
          print()

          print("| Module | Tests | Failed | Errors | Skipped | Time |")
          print("|---|---:|---:|---:|---:|---:|")
          for module, row in sorted(modules.items()):
              print(
                  f"| `{module}` | {row['tests']} | {row['failures']} | "
                  f"{row['errors']} | {row['skipped']} | {row['time']:.1f}s |"
              )

          print()
          print("- Allure report artifact: `allure-report-common`")
          print("- JUnit XML artifact: `junit-results`")

          if failed_cases:
              print()
              print("<details>")
              print("<summary>Failed test cases</summary>")
              print()
              for case in failed_cases[:30]:
                  print(f"- `{html.escape(case)}`")
              if len(failed_cases) > 30:
                  print(f"- ... and {len(failed_cases) - 30} more")
              print()
              print("</details>")
          PY

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-common
          path: build/reports/allure/common/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: "**/build/test-results/jvmTest/**/*.xml"
          if-no-files-found: warn
          retention-days: 14

      # Codecov upload requires CODECOV_TOKEN, which fork PRs don't get and
      # which isn't provisioned until repo admin completes the Codecov setup
      # (see codecov.yml). Guard like the firebase-config caller pattern so a
      # missing secret or fork PR doesn't turn `junit` red.
      - name: Check Codecov token
        if: always()
        id: codecov_token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        if: >-
          always() &&
          steps.codecov_token.outputs.present == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          flags: unittests
          fail_ci_if_error: false
          disable_search: true

      - name: Upload test results to Codecov
        if: >-
          always() &&
          steps.codecov_token.outputs.present == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/build/test-results/jvmTest/**/*.xml"
          flags: unittests

  android-compile:
    name: Android debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PRs from forks don't get repo secrets, so the google-services step below
    # would fail. Skip the job in that case — qaCommon already covers the PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compile-only: catches AGP/Kotlin/google-services regressions without
      # needing the dev keystore (assembleDebug would require DEV_* secrets,
      # see androidApp/build.gradle.kts → signingConfigs.dev).
      - name: Compile Android debug
        run: ./gradlew :androidApp:processDebugGoogleServices :androidApp:compileDebugSources --stacktrace

  android-offline-compile:
    name: Android offline debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile offline Android debug
        run: ./gradlew :androidApp-offline:compileDebugSources --stacktrace

  firestore-rules:
    name: Firestore rules (Mocha + Allure)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Standalone: uses fake `demo-moneysurfer` project against the local
    # Firestore emulator, so no Firebase secrets needed (runs on fork PRs too).

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # firebase-tools ≥14 requires JDK 21+ (the Firestore emulator JAR no
      # longer runs on 17). Other CI jobs stay on 17 — only this job needs 21.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install firebase-tools
        run: npm i -g firebase-tools

      - name: Install firestore-tests deps
        working-directory: firestore-tests
        run: npm ci

      - name: Install Allure CLI
        shell: bash
        run: |
          set -euo pipefail
          ALLURE_VERSION=2.34.1
          curl -Ls "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/allure-${ALLURE_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Run Mocha Firestore-rules tests
        run: ./gradlew qaFirestoreRules --stacktrace

      - name: Write Mocha + Allure summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import html
          import xml.etree.ElementTree as ET

          junit = Path("build/test-results/firestore/firestore-report.xml")

          print("## Firestore rules — Mocha + Allure")
          print()
          if not junit.exists():
              print(f"No JUnit XML found at `{junit}`.")
              raise SystemExit

          try:
              root = ET.parse(junit).getroot()
          except ET.ParseError as exc:
              print(f"Could not parse `{junit}`: {exc}")
              raise SystemExit

          # mocha-junit-reporter wraps everything in a <testsuites> with per-describe
          # <testsuite> children. Aggregate across all of them.
          suites = root.findall("testsuite") or [root]
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "time": 0.0}
          failed_cases = []
          for suite in suites:
              totals["tests"] += int(suite.attrib.get("tests", 0))
              totals["failures"] += int(suite.attrib.get("failures", 0))
              totals["errors"] += int(suite.attrib.get("errors", 0))
              totals["skipped"] += int(suite.attrib.get("skipped", 0))
              totals["time"] += float(suite.attrib.get("time", 0.0))
              for case in suite.findall("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed_cases.append(
                          f"{case.attrib.get('classname', '')}.{case.attrib.get('name', '')}"
                      )

          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          outcome = "✅" if totals["failures"] == 0 and totals["errors"] == 0 else "❌"

          print("| Suite | Tests | Passed | Failed | Errors | Skipped | Time |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          print(
              f"| qaFirestoreRules {outcome} | {totals['tests']} | {passed} | "
              f"{totals['failures']} | {totals['errors']} | {totals['skipped']} | "
              f"{totals['time']:.1f}s |"
          )
          print()
          print("- Allure report artifact: `allure-report-firestore`")
          print("- JUnit XML artifact: `firestore-junit-results`")

          if failed_cases:
              print()
              print("<details>")
              print("<summary>Failed test cases</summary>")
              print()
              for case in failed_cases[:30]:
                  print(f"- `{html.escape(case)}`")
              if len(failed_cases) > 30:
                  print(f"- ... and {len(failed_cases) - 30} more")
              print()
              print("</details>")
          PY

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-firestore
          path: build/reports/allure/firestore/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firestore-junit-results
          path: build/test-results/firestore/*.xml
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip on PRs from forks (no SONAR_TOKEN access from fork secrets).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Sonar needs full git history for blame/new-code detection.
          fetch-depth: 0

      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          debug-json:   ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          release-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          ios-plist:    ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # detekt may fail (violations beyond baseline) but we still want its XML
      # reports for Sonar to ingest, and we don't want it to block analysis
      # publication. Quality-gate enforcement lives on the SonarCloud side.
      - name: Run detekt
        continue-on-error: true
        run: ./gradlew detekt --stacktrace --continue

      - name: Run Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --stacktrace

  ios-build:
    name: iOS simulator build
    runs-on: macos-14
    timeout-minutes: 40
    # macos-14 runners are ~10x more expensive than ubuntu, so we keep this lean:
    # one Debug build for the iOS Simulator (arm64), no code signing, no archive,
    # no Crashlytics dSYM upload. Verifies the Kotlin framework links and the
    # Swift code compiles end-to-end against the embedded framework.
    # PRs from forks don't get repo secrets (GoogleService-Info.plist), skip them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # iOS build only needs the GoogleService-Info.plist — don't expose the
      # Android secrets to this job. (Can't use require-all=true here: it
      # validates every input, not just the ones we passed.)
      - name: Decode Firebase config
        uses: ./.github/actions/firebase-config
        with:
          ios-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show Xcode version
        run: xcodebuild -version

      # Pre-link the Kotlin framework for the simulator arch so the Xcode build
      # phase has its inputs ready and SPM resolution doesn't race with Gradle
      # on first run.
      - name: Link Kotlin framework (iosSimulatorArm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build iOS app (Simulator, no signing)
        env:
          SKIP_CRASHLYTICS_UPLOAD: "YES"
        run: |
          set -eo pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            FORMATTER=(xcbeautify --renderer github-actions)
          else
            FORMATTER=(cat)
          fi
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | "${FORMATTER[@]}"
