name: iOS distribute

# Builds the Release archive of iosApp (online variant), exports an App Store
# IPA, and uploads it to App Store Connect for TestFlight processing.
#
# Scope: ios-online only. iosAppOffline remains outside this tester lane.
#
# Required repo secrets (see docs/ci/testflight.md):
#   GOOGLE_SERVICE_INFO_PLIST_RELEASE  base64 production Firebase plist
#   ASC_API_KEY_ID                     App Store Connect API key id
#   ASC_API_ISSUER_ID                  App Store Connect issuer UUID
#   ASC_API_KEY_BASE64                 base64 AuthKey_<id>.p8
#   IOS_DISTRIBUTION_CERTIFICATE_BASE64  base64 Apple Distribution .p12
#   IOS_DISTRIBUTION_CERTIFICATE_PASSWORD  password of that .p12
#   IOS_PROVISIONING_PROFILE_BASE64    base64 App Store profile
#
# Optional:
#   ASC_TEAM_ID                        Apple team id (release.sh has a default)

on:
  workflow_dispatch:
  schedule:
    # 04:17 UTC — 30 min after android-distribute.yml.
    - cron: "17 4 * * *"

concurrency:
  group: ios-distribute
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  distribute:
    name: Build + upload release IPA
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read

    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # A manual upload must fail loudly when setup is incomplete. The nightly
      # schedule only emits a notice so missing initial secrets don't make the
      # default branch red every day.
      - name: Check required secrets
        id: preflight
        env:
          FIREBASE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_RELEASE }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$FIREBASE_PLIST" ] || missing+=(GOOGLE_SERVICE_INFO_PLIST_RELEASE)
          [ -n "$API_KEY_ID" ] || missing+=(ASC_API_KEY_ID)
          [ -n "$API_ISSUER_ID" ] || missing+=(ASC_API_ISSUER_ID)
          [ -n "$API_KEY_BASE64" ] || missing+=(ASC_API_KEY_BASE64)
          [ -n "$DISTRIBUTION_CERTIFICATE" ] || missing+=(IOS_DISTRIBUTION_CERTIFICATE_BASE64)
          [ -n "$DISTRIBUTION_CERTIFICATE_PASSWORD" ] || missing+=(IOS_DISTRIBUTION_CERTIFICATE_PASSWORD)
          [ -n "$PROVISIONING_PROFILE" ] || missing+=(IOS_PROVISIONING_PROFILE_BASE64)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Missing secrets: ${missing[*]} — see docs/ci/testflight.md"
            exit 1
          fi
          echo "::notice::Missing secrets: ${missing[*]} — skipping scheduled distribute."

      - name: Skip if no new commits since last successful run
        id: check
        if: steps.preflight.outputs.ready == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          last_sha=$(gh run list \
            --workflow=ios-distribute.yml \
            --branch=main \
            --status=success \
            --limit=2 \
            --json headSha,databaseId \
            --repo "$GITHUB_REPOSITORY" \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }})][0].headSha // ""')
          echo "last successful SHA: ${last_sha:-<none>}"
          echo "current SHA:         $GITHUB_SHA"
          if [[ -n "$last_sha" && "$last_sha" == "$GITHUB_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decode production Firebase config
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        uses: ./.github/actions/firebase-config
        with:
          ios-release-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_RELEASE }}

      - name: Decode App Store Connect API key
        id: api-key
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        env:
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "$API_KEY_BASE64" | base64 -d > "$dest"
          if [ ! -s "$dest" ]; then
            echo "::error::ASC_API_KEY_BASE64 decoded to an empty file."
            exit 1
          fi
          chmod 600 "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      # The API key authenticates App Store Connect and automatic provisioning,
      # but exportArchive cannot use cloud signing unless that key has a
      # separate Apple permission. Install explicit distribution assets so the
      # export works independently of cloud-managed certificates.
      - name: Install distribution signing assets
        id: signing
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          certificate="${RUNNER_TEMP}/ios-distribution.p12"
          keychain="${RUNNER_TEMP}/ios-signing.keychain-db"
          profile="${HOME}/Library/MobileDevice/Provisioning Profiles/ci-app-store.mobileprovision"
          profile_plist="${RUNNER_TEMP}/ios-provisioning-profile.plist"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -d > "$certificate"
          printf '%s' "$PROFILE_BASE64" | base64 -d > "${RUNNER_TEMP}/ios-profile.mobileprovision"
          [ -s "$certificate" ] || { echo "::error::Distribution certificate decoded to an empty file."; exit 1; }
          [ -s "${RUNNER_TEMP}/ios-profile.mobileprovision" ] \
            || { echo "::error::Provisioning profile decoded to an empty file."; exit 1; }

          security cms -D -i "${RUNNER_TEMP}/ios-profile.mobileprovision" > "$profile_plist"
          app_identifier=$(plutil -extract Entitlements.application-identifier raw "$profile_plist")
          profile_name=$(plutil -extract Name raw "$profile_plist")
          case "$app_identifier" in
            *.com.georgeci.moneysurfer) ;;
            *)
              echo "::error::Provisioning profile is for '$app_identifier', expected com.georgeci.moneysurfer."
              exit 1
              ;;
          esac
          mkdir -p "$(dirname "$profile")"
          cp "${RUNNER_TEMP}/ios-profile.mobileprovision" "$profile"
          chmod 600 "$profile"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          existing_keychains=()
          while IFS= read -r existing; do
            existing_keychains+=("${existing//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"
          security find-identity -v -p codesigning "$keychain" \
            | grep -E 'Apple Distribution|iPhone Distribution' > /dev/null \
            || { echo "::error::The .p12 contains no Apple Distribution signing identity."; exit 1; }

          {
            echo "keychain=$keychain"
            echo "profile=$profile"
            echo "profile-name=$profile_name"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Cache Kotlin/Native (~/.konan)
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        uses: ./.github/actions/konan-cache

      - name: Select Xcode
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        uses: ./.github/actions/select-xcode

      - name: Archive, export, and upload iosApp
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ steps.api-key.outputs.path }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ASC_BUILD_NUMBER: ${{ github.run_number }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
        run: scripts/ios/release.sh main

      - name: Locate IPA
        id: ipa
        if: steps.preflight.outputs.ready == 'true' && steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ipa=$(find build/ios/iosApp -path '*/export/*.ipa' -type f | head -1)
          if [ -z "$ipa" ]; then
            echo "::error::No IPA produced by scripts/ios/release.sh main."
            exit 1
          fi
          echo "path=$ipa" >> "$GITHUB_OUTPUT"
          {
            echo "### TestFlight"
            echo
            echo "- IPA: \`$(basename "$ipa")\`"
            echo "- Build: \`${GITHUB_RUN_NUMBER}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "Upload completed; App Store Connect processing continues asynchronously."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          PROVISIONING_PROFILE: ${{ steps.signing.outputs.profile }}
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/AuthKey.p8"
          rm -f \
            "${RUNNER_TEMP}/ios-distribution.p12" \
            "${RUNNER_TEMP}/ios-profile.mobileprovision" \
            "${RUNNER_TEMP}/ios-provisioning-profile.plist"
          if [ -n "$API_KEY_ID" ]; then
            rm -f "${HOME}/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          fi
          if [ -n "$PROVISIONING_PROFILE" ]; then
            rm -f "$PROVISIONING_PROFILE"
          fi
          if [ -n "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Upload IPA artifact
        if: steps.ipa.outputs.path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iosApp-release-ipa
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 14
          if-no-files-found: error
