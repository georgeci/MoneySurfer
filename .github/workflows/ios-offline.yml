name: iOS offline

# Per-PR + main lane for the offline iOS app (issue #83). Build-only: it links
# the Kotlin framework and compiles iosAppOffline via xcodebuild, catching
# Kotlin/Swift/link regressions on every PR without paying for a simulator boot
# or a Maestro run. The simulator run lives in nightly.yml's
# `maestro-ios-offline` job alongside the other E2E jobs (issue #172 §4) — E2E
# signal on every PR isn't worth the macos-15 minutes. That job currently drives
# the launch smoke (scripts/maestro/ios/app-open.yaml) rather than the offline
# golden flow (scripts/maestro/offline/offline-golden.yaml, issue #69), which
# runs on Android while the iOS suites are cut back (issue #297).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same fan-out gate as ci.yml, via job-level `if:` instead of top-level
  # `paths-ignore` so a required status check still reports. Push-to-main and
  # manual runs build unconditionally (the gate job doesn't even start).
  #
  # macos-15 minutes cost roughly ten times ubuntu's, so this is the lane that
  # most wants a precise filter: a Firestore-rules, JavaScript or documentation
  # PR cannot move the Kotlin/Native framework and no longer links it.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    outputs:
      ios: ${{ steps.gate.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Shared path filter — see .github/actions/paths-gate.
      - name: Filter paths
        id: gate
        uses: ./.github/actions/paths-gate

  ios-offline:
    name: iOS offline build (Simulator)
    runs-on: macos-15
    timeout-minutes: 40
    needs: changes
    # `changes` is skipped on push/dispatch, so `!cancelled()` (not the
    # default success-of-needs) keeps this job eligible; the second clause
    # then gates PR runs on the paths filter.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Firebase config step on purpose: the offline app must build without
      # any networked services baked in. No maestro-setup either — this lane
      # only compiles; the golden flow runs in nightly.
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # Canonical macOS Gradle cache writer. setup-gradle writes only on the
      # default branch by default; other macOS jobs are explicitly read-only.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Cache the Kotlin/Native toolchain (~/.konan) that linkDebugFramework
      # below pulls — setup-gradle doesn't cover it. macOS runner minutes.
      - name: Cache Kotlin/Native (~/.konan)
        uses: ./.github/actions/konan-cache

      # Prints the selected version; replaces a bare `xcodebuild -version`.
      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # Pre-link the Kotlin framework for the simulator arch so the Xcode
      # build phase has its inputs ready and SPM resolution doesn't race with
      # Gradle on first run (same reasoning as the nightly iOS jobs).
      - name: Link Kotlin framework (iosSimulatorArm64, offline)
        run: ./gradlew :composeAppOffline:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # Resolve a valid simulator *name* for xcodebuild's `-destination name=…`
      # without booting one (boot: false) — a build needs the device to exist,
      # not to be running. Saves the ~1–2 min simulator boot on every PR.
      - name: Resolve iOS simulator (no boot)
        id: ios-sim
        uses: ./.github/actions/ios-simulator
        with:
          boot: "false"

      # Compile iosAppOffline via xcodebuild (maestroBuildIosOfflineSimulator).
      # Build-only: no install, no simulator run, no Maestro flow.
      - name: Build iosAppOffline (Simulator)
        run: |
          ./gradlew maestroBuildIosOfflineSimulator \
            -PiosSimulatorName="${{ steps.ios-sim.outputs.name }}" \
            --stacktrace
