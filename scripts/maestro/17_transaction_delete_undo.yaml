appId: ${APP_ID}
name: Transaction — Delete then Undo restores it
---
# Chain 03, not 04: this flow deletes the transaction it opens, so it owns one of
# its own. Driving 04's shared "Test expense" meant a failure between the delete
# and the Undo removed the baseline that 07 asserts on and 08 edited — and which
# flow noticed depended on the order Maestro happened to pick (#351).
#
# The flow is self-restoring: Undo puts "Undoable expense" back, so the guard
# below finds it again on the next run.
- runFlow: 03_dashboard_add_account.yaml

- runFlow:
    when:
      notVisible: "Undoable expense"
    commands:
      # testTag selectors + note-before-amount ordering — see the rationale in
      # 04_add_transaction.yaml.
      - tapOn:
          id: "dashboard:addTransaction"
      - assertVisible:
          id: "transactionCreation:root"
      - tapOn:
          id: "transactionCreation:note"
      - inputText: "Undoable expense"
      - tapOn:
          id: "transactionCreation:amount"
      - inputText: "30"
      - tapOn:
          id: "transactionCreation:save"

# The Recent widget shows only the newest few transactions and this workspace
# gains one per transaction flow, so scroll instead of assuming the row landed
# on the first screenful.
- scrollUntilVisible:
    element:
      text: "Undoable expense"
    direction: DOWN
- tapOn:
    text: "Undoable expense"
- assertVisible:
    id: "transactionDetails:root"

- tapOn:
    id: "transactionDetails:delete"
# The confirm button carries its own tag: the dialog is a separate window, and
# both it and the screen action behind it read "Delete".
- assertVisible:
    id: "transactionDetails:confirmDelete"
- tapOn:
    id: "transactionDetails:confirmDelete"

# The delete navigates back; the app-root Snackbar offers an Undo.
- assertVisible:
    text: "Undo"
- tapOn:
    text: "Undo"

# Undo re-applies the deleted transaction — it reappears in Recent.
- scrollUntilVisible:
    element:
      text: "Undoable expense"
    direction: DOWN
- assertVisible:
    text: "Undoable expense"
