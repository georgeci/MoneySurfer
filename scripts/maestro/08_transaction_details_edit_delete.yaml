appId: ${APP_ID}
name: Transaction — Details, edit and delete
---
# Chain 03, not 04: this flow renames and then deletes the transaction it opens,
# so it has to own that transaction outright. It used to drive 04's shared "Test
# expense" — which 07 reads and 17 deletes — so a failure between the rename and
# the delete left the shared baseline renamed for every later flow, and 04's
# create-if-missing guard then logged a second "Test expense" beside the orphan
# (#351). "Editable expense" is written and read by this flow alone.
- runFlow: 03_dashboard_add_account.yaml

# Bring the Recent widget on screen *before* the guard reads it — `notVisible` on
# the unscrolled dashboard reports "missing" for a transaction that merely sits
# below the fold. See the fuller note in 17_transaction_delete_undo.yaml.
- scrollUntilVisible:
    element:
      id: "dashboard:recent"
    direction: DOWN

- runFlow:
    when:
      notVisible: "Editable expense"
    commands:
      # testTag selectors + note-before-amount ordering — see the rationale in
      # 04_add_transaction.yaml.
      - tapOn:
          id: "dashboard:addTransaction"
      - assertVisible:
          id: "transactionCreation:root"
      - tapOn:
          id: "transactionCreation:note"
      - inputText: "Editable expense"
      - tapOn:
          id: "transactionCreation:amount"
      - inputText: "70"
      - tapOn:
          id: "transactionCreation:save"

# The Recent widget shows only the newest few transactions and this workspace
# gains one per transaction flow, so scroll instead of assuming the row landed
# on the first screenful.
- scrollUntilVisible:
    element:
      text: "Editable expense"
    direction: DOWN
- tapOn:
    text: "Editable expense"

- assertVisible:
    id: "transactionDetails:root"
- assertVisible:
    text: "Editable expense"
- assertVisible:
    text: "Main Bank"

- tapOn:
    id: "transactionDetails:edit"

# Editing reuses the creation screen, so it answers to the same root tag.
- assertVisible:
    id: "transactionCreation:root"
# Address the field and the confirm action by testTag. Tapping the floating
# "Note" label doesn't reliably focus an OutlinedTextField (it left the cursor
# mid-string and garbled the text), and the toolbar "Update" button is the same
# `transactionCreation:save` node as on the create screen (#219).
- tapOn:
    id: "transactionCreation:note"
- eraseText: 50
- inputText: "Edited expense"
# Move focus back to the amount field before confirming: typing in the note
# pushes the form up far enough that the toolbar — and with it the Update
# button — scrolls off the top, so tapping it straight away finds nothing.
- tapOn:
    id: "transactionCreation:amount"
- tapOn:
    id: "transactionCreation:save"

- assertVisible:
    id: "transactionDetails:root"
- assertVisible:
    text: "Edited expense"

- tapOn:
    id: "transactionDetails:delete"
# The confirm button carries its own tag: the dialog is a separate window, and
# both it and the screen action behind it read "Delete".
- assertVisible:
    id: "transactionDetails:confirmDelete"
- tapOn:
    id: "transactionDetails:confirmDelete"

# Back on the Dashboard. Popping back *restores* the scroll offset rather than
# reopening at the top, and this flow left it parked down at Recent — so the
# Accounts widget is now above us, and scrolling down could never reach it.
# Reset to the balance card at the top first, then walk down to Accounts; that
# pair works from wherever the pop happened to land (#297).
- extendedWaitUntil:
    visible:
      id: "dashboard:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "dashboard:balance"
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "dashboard:accounts"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "dashboard:accounts"
