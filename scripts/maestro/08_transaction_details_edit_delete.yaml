appId: ${APP_ID}
name: Transaction — Details, edit and delete
---
- runFlow: 04_add_transaction.yaml

- tapOn:
    text: "Test expense"

- assertVisible:
    text: "Transaction"
- assertVisible:
    text: "Test expense"
- assertVisible:
    text: "Account"
- assertVisible:
    text: "Main Bank"

- tapOn:
    text: "Edit"

- assertVisible:
    text: "Edit transaction"
- scrollUntilVisible:
    element:
      text: "Note"
    direction: DOWN
# Tap the existing value, not the floating "Note" label — tapping the label
# of an OutlinedTextField doesn't reliably focus the field, leaving the
# cursor mid-string and producing garbled text after eraseText/inputText.
- tapOn:
    text: "Test expense"
- eraseText: 50
- inputText: "Updated expense"
- tapOn:
    text: "Update"

- assertVisible:
    text: "Transaction"
- assertVisible:
    text: "Updated expense"

- tapOn:
    text: "Delete"
- assertVisible:
    text: "Delete transaction?"
- tapOn:
    text: "Delete"

- assertVisible:
    text: "Accounts"
