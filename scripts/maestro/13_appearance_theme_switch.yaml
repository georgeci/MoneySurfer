appId: ${APP_ID}
name: Appearance — Switch theme between Dark, Light and System
---
# Pre-condition: active workspace and dashboard.
# Settings → Appearance → tap each theme row, assert all three are visible
# (radio rows persist regardless of selection).
#
# Scope note: this flow proves the rows are reachable and survive each tap. It
# does NOT prove the tap selected anything. The assertions it used to make —
# "Dim surfaces, less glare" after tapping Dark — read like selection checks but
# are static row subtitles that AppearanceScreen renders for every row whether or
# not it is selected, so they held before the tap too. Asserting real selection
# needs the radio state exposed; tracked separately (#352).

- runFlow: 03_dashboard_add_account.yaml

# Navigate by testTag: the dashboard gear and the Settings rows are icon/row
# composables whose labels aren't reliable Maestro selectors on iOS (#219).
- tapOn:
    id: "dashboard:settings"
- assertVisible:
    id: "settings:root"

- tapOn:
    id: "settings:appearanceRow"

# Appearance screen
- assertVisible:
    id: "appearance:root"
- assertVisible:
    id: "appearance:theme:system"
- assertVisible:
    id: "appearance:theme:light"
- assertVisible:
    id: "appearance:theme:dark"

# Switch to Dark
- tapOn:
    id: "appearance:theme:dark"
- assertVisible:
    id: "appearance:theme:dark"

# Switch to Light
- tapOn:
    id: "appearance:theme:light"
- assertVisible:
    id: "appearance:theme:light"

# Restore Follow system — this flow moved the setting, so this flow puts it back.
# That is self-cleanup, not the successor-oriented kind 03a used to do (#351).
- tapOn:
    id: "appearance:theme:system"
- assertVisible:
    id: "appearance:theme:system"

# Try a different card style, then restore the default fill.
- scrollUntilVisible:
    element:
      id: "appearance:cardStyle:outlined"
    direction: DOWN
- tapOn:
    id: "appearance:cardStyle:outlined"
- assertVisible:
    id: "appearance:cardStyle:outlined"
- tapOn:
    id: "appearance:cardStyle:filled"

- tapOn:
    id: "toolbar:back"
- assertVisible:
    id: "settings:root"
