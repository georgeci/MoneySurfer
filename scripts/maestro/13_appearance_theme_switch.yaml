appId: ${APP_ID}
name: Appearance — Switch theme between Dark, Light and System
---
# Pre-condition: active workspace and dashboard.
# Settings → Appearance → tap each theme row, assert all three are visible
# (radio rows persist regardless of selection).

- runFlow: 03_dashboard_add_account.yaml

# Navigate by testTag: the dashboard gear and the Settings rows are icon/row
# composables whose labels aren't reliable Maestro selectors on iOS (#219).
- tapOn:
    id: "dashboard:settings"
- assertVisible:
    id: "settings:root"

- tapOn:
    id: "settings:appearanceRow"

# Appearance screen
- assertVisible:
    text: "Theme"
- assertVisible:
    text: "Follow system"
- assertVisible:
    text: "Light"
- assertVisible:
    text: "Dark"
- assertVisible:
    text: "Card style"

# Switch to Dark
- tapOn:
    text: "Dark"
- assertVisible:
    text: "Dim surfaces, less glare"

# Switch to Light
- tapOn:
    text: "Light"
- assertVisible:
    text: "Bright surfaces"

# Restore Follow system
- tapOn:
    text: "Follow system"
- assertVisible:
    text: "Match device dark mode"

# Try a different card style and back
- tapOn:
    text: "Outlined"
- assertVisible:
    text: "Bordered surfaces, no fill"

- tapOn:
    text: "Back"
- assertVisible:
    id: "settings:root"
