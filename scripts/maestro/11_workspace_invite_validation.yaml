appId: ${APP_ID}
name: Workspace — Invite member validation
---
- runFlow: 02_workspace_create.yaml

# Settings gear by testTag — no selectable label on iOS (#219).
- tapOn:
    id: "dashboard:settings"

- assertVisible:
    id: "settings:root"
- tapOn:
    id: "settings:membersRow"

- assertVisible:
    id: "workspaceMembers:root"
- tapOn:
    id: "workspaceMembers:invite"

- assertVisible:
    id: "workspaceInvite:root"
- tapOn:
    id: "workspaceInvite:email"
- inputText: "not-an-email"
# Dismiss the keyboard first: "Send invite" sits behind it, so tapping straight
# away lands on the keyboard and the invite is never submitted (#219).
- pressKey: Enter
- tapOn:
    id: "workspaceInvite:send"

# The validation message stays a `text:` selector on purpose — this copy *is* the
# behaviour under test (README.md → Selectors).
- assertVisible:
    text: "That doesn't look like a valid email."
