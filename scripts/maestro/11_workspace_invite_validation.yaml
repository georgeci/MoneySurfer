appId: ${APP_ID}
name: Workspace — Invite member validation
---
- runFlow: 02_workspace_create.yaml

# Settings gear by testTag — no selectable label on iOS (#219).
- tapOn:
    id: "dashboard:settings"

- assertVisible:
    id: "settings:root"
- tapOn:
    text: "Members & permissions"

- assertVisible:
    text: "Test Workspace · Members"
- tapOn:
    text: "Invite people"

- assertVisible:
    text: "Invite member"
- tapOn:
    text: "Email"
- inputText: "not-an-email"
# Dismiss the keyboard first: "Send invite" sits behind it, so tapping straight
# away lands on the keyboard and the invite is never submitted (#219).
- pressKey: Enter
- tapOn:
    text: "Send invite"

- assertVisible:
    text: "That doesn't look like a valid email."
