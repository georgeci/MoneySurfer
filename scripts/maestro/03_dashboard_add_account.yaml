appId: ${APP_ID}
name: Dashboard — Add bank account
---
# Pre-condition: user is on DashboardScreen with a workspace
# Chain after 02_workspace_create.yaml or run standalone with existing session + workspace

- runFlow: 02_workspace_create.yaml

# Assert dashboard content is visible
- assertVisible:
    text: "Accounts"

# Create the baseline account once and reuse it across the remaining flows.
#
# Wait for the account list to arrive before deciding. "Accounts" above is just
# the section header — it renders before Firestore has streamed the rows, so on
# a slow read the guard below would fire against an already-populated workspace,
# and the duplicate-name validation then leaves the create form stuck (#219).
#
# 20s, not 10s: this is a cold-launch read (00_login relaunches the app), and
# late in a full suite run the emulator has been slow enough to blow a 10s
# budget. The wait is optional, so a workspace that genuinely has no account
# still costs the full timeout exactly once.
- extendedWaitUntil:
    visible: "Main Bank"
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible: "Main Bank"
    commands:
      - tapOn:
          text: "Add account"
      - assertVisible:
          text: "New account"
      - tapOn:
          text: "Account name"
      - inputText: "Main Bank"
      - tapOn:
          text: "Bank"
      - tapOn:
          text: "Save"

# Assert back on Dashboard and account card is visible
- assertVisible:
    text: "Accounts"
- assertVisible:
    text: "Main Bank"

# The Add / Transfer quick-action buttons were removed from the Dashboard (issue #62).
# Anchored regex so "Add account" / "Add transaction" do not satisfy the match.
- assertNotVisible:
    text: "^Add$"
- assertNotVisible:
    text: "^Transfer$"
