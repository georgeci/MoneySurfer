appId: ${APP_ID}
name: Settings — Open hub screens
---
# Ensures the dashboard has an active workspace and at least one account.
- runFlow: 03_dashboard_add_account.yaml

# Navigate by testTag — the gear and the hub rows aren't reliably addressable
# by label on iOS (#219).
- tapOn:
    id: "dashboard:settings"

- assertVisible:
    id: "settings:root"
# Online build shows the profile/Name section; the offline build hides it.
- assertVisible:
    text: "Kasia Nowak"
- assertVisible:
    text: "Workspace"
- assertVisible:
    id: "settings:categoriesRow"
- assertVisible:
    id: "settings:appearanceRow"
- assertVisible:
    text: "Help & info"

# The Sync hub is deliberately absent here: `OnlineSignInModule` binds
# `SyncFeatureFlag(enabled = false)`, and `SettingsState.showSyncSection` gates
# the row on it, so the online build composes no Sync row to open. Covered by
# 14_force_sync_now.yaml, which is tagged `sync` and excluded from this suite
# until the flag is flipped on.

- tapOn:
    id: "settings:appearanceRow"
- assertVisible:
    text: "Theme"
- tapOn:
    text: "Back"

- scrollUntilVisible:
    element:
      id: "settings:aboutRow"
    direction: DOWN
- tapOn:
    id: "settings:aboutRow"
- assertVisible:
    text: "MoneySurfer"
- tapOn:
    text: "Back"

- scrollUntilVisible:
    element:
      id: "settings:logoutRow"
    direction: DOWN
- assertVisible:
    id: "settings:logoutRow"
