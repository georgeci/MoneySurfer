appId: ${APP_ID}
name: Settings — Open hub screens
---
# Ensures the dashboard has an active workspace and at least one account.
- runFlow: 03_dashboard_add_account.yaml

# Navigate by testTag — the gear and the hub rows aren't reliably addressable
# by label on iOS (#219).
- tapOn:
    id: "dashboard:settings"

- assertVisible:
    id: "settings:root"
# Online build shows the profile/Name section; the offline build hides it. Assert
# the row, not the value: the previous `text: "Kasia Nowak"` pinned this flow to
# a profile name that scripts/firebase/seed.sh never creates, so where it came
# from — and what would happen to this flow if it changed — was anybody's guess
# (#352).
- assertVisible:
    id: "settings:profileName"
- assertVisible:
    id: "settings:workspaceRow"
- assertVisible:
    id: "settings:membersRow"
- assertVisible:
    id: "settings:categoriesRow"
- assertVisible:
    id: "settings:appearanceRow"

# The Sync hub is deliberately absent here. `SettingsState.showSyncSection` is
# `!isOffline && syncEnabled`, and `syncEnabled` comes from `SyncSettings.isEnabled`
# — build AND server kill switch AND user toggle (#345 replaced the old
# `SyncFeatureFlag` binding with this layered config). Sync has been off since
# #110, so the online build composes no Sync row to open. Covered by
# 14_force_sync_now.yaml, which is tagged `sync` and excluded from this suite
# until it is switched on.

- tapOn:
    id: "settings:appearanceRow"
- assertVisible:
    id: "appearance:root"
- tapOn:
    id: "toolbar:back"

- scrollUntilVisible:
    element:
      id: "settings:aboutRow"
    direction: DOWN
- tapOn:
    id: "settings:aboutRow"
- assertVisible:
    id: "about:root"
- tapOn:
    id: "toolbar:back"

- scrollUntilVisible:
    element:
      id: "settings:logoutRow"
    direction: DOWN
- assertVisible:
    id: "settings:logoutRow"
