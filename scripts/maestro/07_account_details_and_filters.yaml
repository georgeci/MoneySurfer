appId: ${APP_ID}
name: Account — Details and transaction filters
---
- runFlow: 04_add_transaction.yaml

- tapOn:
    text: "Main Bank"

- assertVisible:
    text: "Account"
- assertVisible:
    text: "Main Bank"
- assertVisible:
    text: "Transactions"
- assertVisible:
    text: "Test expense"

- tapOn:
    text: "Expenses"
- assertVisible:
    text: "Test expense"

- tapOn:
    text: "Income"
- assertVisible:
    text: "No transactions yet."

- tapOn:
    text: "All"
- assertVisible:
    text: "Test expense"

- tapOn:
    text: "See all"
# TransactionsByAccountScreen uses the account name as the toolbar title
# (falls back to "Transactions" only when blank), and the "New" FAB is an
# ExtendedFloatingActionButton whose label isn't surfaced as a11y text on
# this Compose version. Assert on the per-account header + a tx row.
- assertVisible:
    text: "Main Bank"
- assertVisible:
    text: "Test expense"
