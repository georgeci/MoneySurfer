appId: ${APP_ID}
name: Account — Details and transaction filters
---
# Read-only over the shared baseline: this flow opens 04's "Test expense" and
# filters around it, but never mutates it. Flows that *do* mutate a transaction
# (08, 17) own theirs — see README.md → Rules for writing a flow.
- runFlow: 04_add_transaction.yaml

- tapOn:
    text: "Main Bank"

- assertVisible:
    id: "accountDetails:root"
- assertVisible:
    text: "Main Bank"
- assertVisible:
    text: "Test expense"

- tapOn:
    id: "accountDetails:filter:expenses"
- assertVisible:
    text: "Test expense"

- tapOn:
    id: "accountDetails:filter:income"
# Assert the filter *excludes* the expense rather than that the list is empty:
# 09_income_transaction_filter logs a "Salary" income against this same account,
# and Maestro gives no ordering guarantee between the two flows (#219).
- assertNotVisible:
    text: "Test expense"

- tapOn:
    id: "accountDetails:filter:all"
- assertVisible:
    text: "Test expense"

- tapOn:
    id: "accountDetails:seeAll"
# TransactionsByAccountScreen uses the account name as the toolbar title, so the
# per-account header is fixture data rather than product copy.
- assertVisible:
    id: "transactionsList:root"
- assertVisible:
    text: "Main Bank"
- assertVisible:
    text: "Test expense"
