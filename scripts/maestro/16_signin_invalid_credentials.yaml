appId: ${APP_ID}
name: Auth — Sign in rejects empty and wrong credentials
---
# Negative test for the email/password form. Starts from a clean app state so
# the Sign-in screen is reachable without depending on prior flows; ends by
# clearing the inputs so a follow-up 00_login chain can type into empty fields.

- launchApp:
    clearState: true

- assertVisible:
    text: "MoneySurfer"
- assertVisible:
    text: "Sign in"

# Empty submit — client-side validation rejects without contacting Firebase.
- tapOn:
    text: "Sign in"
- assertVisible:
    text: "Enter email and password"

# Bad credentials — server-side rejection from the Auth emulator.
- tapOn:
    text: "Email"
- inputText: "nobody@test.local"

- tapOn:
    text: "Password"
- inputText: "wrong-password"

- tapOn:
    text: "Sign in"

- assertVisible:
    text: "Wrong email or password"
- assertVisible:
    text: "Sign in"

# Tidy up so the next test starts with empty fields.
- tapOn:
    text: "Email"
- eraseText
- tapOn:
    text: "Password"
- eraseText
