appId: ${APP_ID}
name: Auth — Sign in rejects wrong credentials
---
# Negative test for the email/password form. Starts from a clean app state so
# the Sign-in screen is reachable without depending on prior flows; ends by
# clearing the inputs so a follow-up 00_login chain can type into empty fields.

- launchApp:
    clearState: true

- assertVisible:
    id: "signIn:root"
- assertVisible:
    id: "signIn:brandHeader"

# Note: the Submit button is disabled until email is non-blank and password is
# at least 6 chars (SignInState.canSubmit), so the "missing credentials"
# branch is unreachable through the UI. We exercise only the server-side
# rejection path here.

# Bad credentials — server-side rejection from the Auth emulator. Advance
# between fields with the keyboard IME actions instead of tapping each field:
# on the iOS Simulator the password field and Sign-in button sit behind the
# keyboard the email field raises, so a direct tap is swallowed (#219). Email is
# ImeAction.Next (Enter → password), password is ImeAction.Done (Enter →
# dismiss keyboard); the button is then tappable.
- tapOn:
    id: "signIn:email"
- inputText: "nobody@test.local"
- pressKey: Enter

- inputText: "wrong-password"
- pressKey: Enter

- tapOn:
    id: "signIn:submit"

# Server-side rejections surface in a modal dialog now, not inline on the sheet:
# SignInViewModel marks every mapped auth failure `SignInErrorPresentation.Dialog`
# (#360). Assert the dialog, then dismiss it — leaving a modal open would be
# state handed to whatever runs next.
- assertVisible:
    id: "signIn:errorDialog"
# The rejection message stays a `text:` selector on purpose — this copy *is* the
# behaviour under test (README.md → Selectors).
- assertVisible:
    text: "Wrong email or password"

- tapOn:
    id: "signIn:errorDialog:confirm"
- assertNotVisible:
    id: "signIn:errorDialog"
- assertVisible:
    id: "signIn:root"

# No field clean-up here. This flow used to erase both inputs "so a follow-up
# 00_login chain can type into empty fields" — a tail that only ran when the
# flow passed, and which encoded an assumption about what the suite schedules
# next that Maestro never guaranteed (#351). Every chain starts at 00_login,
# whose `launchApp` restarts the process and composes the form empty anyway.
