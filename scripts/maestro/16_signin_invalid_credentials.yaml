appId: ${APP_ID}
name: Auth — Sign in rejects wrong credentials
---
# Negative test for the email/password form. Starts from a clean app state so
# the Sign-in screen is reachable without depending on prior flows; ends by
# clearing the inputs so a follow-up 00_login chain can type into empty fields.

- launchApp:
    clearState: true

- assertVisible:
    text: "MoneySurfer"
- assertVisible:
    text: "Sign in"

# Note: the Submit button is disabled until email is non-blank and password is
# at least 6 chars (SignInState.canSubmit), so the "missing credentials"
# branch is unreachable through the UI. We exercise only the server-side
# rejection path here.

# Bad credentials — server-side rejection from the Auth emulator. Advance
# between fields with the keyboard IME actions instead of tapping each field:
# on the iOS Simulator the password field and Sign-in button sit behind the
# keyboard the email field raises, so a direct tap is swallowed (#219). Email is
# ImeAction.Next (Enter → password), password is ImeAction.Done (Enter →
# dismiss keyboard); the button is then tappable.
- tapOn:
    text: "Email"
- inputText: "nobody@test.local"
- pressKey: Enter

- inputText: "wrong-password"
- pressKey: Enter

- tapOn:
    text: "Sign in"

- assertVisible:
    text: "Wrong email or password"
- assertVisible:
    text: "Sign in"

# Tidy up so the next test starts with empty fields. Re-focus email, erase, then
# ride ImeAction.Next to the password field (avoids a keyboard-occluded tap).
- tapOn:
    text: "Email"
- eraseText
- pressKey: Enter
- eraseText
