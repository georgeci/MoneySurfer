appId: ${APP_ID}
name: Offline — Golden path (first launch → onboarding → first account → transaction → settings)
tags:
  - offline
---
# Offline-build E2E golden path. Drives the `:androidApp-offline` / `:iosAppOffline`
# binary, which needs no Firebase emulator: the offline first run walks the
# two-step onboarding, seeds a "Personal" workspace on the way out, and lands on
# the first-account form.
#
# Excluded from the online suites via `tags: [offline]`; run it with the
# dedicated `qaMaestroOfflineAndroid` / `qaMaestroOfflineIos` Gradle tasks.
#
# Selectors target Compose `testTag` values exposed to Maestro via
# `Modifier.surferTestTagAsId()` — see docs/testing/testing-strategy.md.

# Fresh install: wipe state so onboarding and the first-run seeder run.
- launchApp:
    clearState: true

# 1. First launch lands on onboarding (#279 put it ahead of everything else;
#    the standalone first-run currency picker this flow used to drive is gone).
- assertVisible:
    id: "onboarding:root"

# 2. Value pitch → the offline-only "where do we start?" step → first account.
#    The same CTA id carries both steps; Cash is preselected, and confirming it
#    runs `FirstRunSeeder` before routing to the account form.
- tapOn:
    id: "onboarding:continue"
- tapOn:
    id: "onboarding:continue"

# 3. Name the first account and save. Currency defaults to EUR, and Save sits in
#    the top bar where the keyboard can never cover it. The first-run variant of
#    this screen carries a different title ("Your first account") but the same
#    root, so the id holds for both entry points.
- assertVisible:
    id: "accountCreation:root"
- tapOn:
    id: "accountCreation:name"
- inputText: "Cash"
- tapOn:
    id: "accountCreation:save"

# 4. Seed verified — Dashboard renders with the balance widget and the
#    add-transaction FAB (only shown once the "Cash" account exists).
- assertVisible:
    id: "dashboard:root"
- assertVisible:
    id: "dashboard:balance"
- assertVisible:
    id: "dashboard:addTransaction"

# 5. Create an expense transaction. Field order avoids ever needing
#    hideKeyboard (unreliable on iOS — iPhone keyboards have no dismiss key):
#    the note is typed first while the screen has no keyboard covering it,
#    then the amount (pinned at the top, never covered), then Save in the
#    top bar. Tapping a field that sits under an open keyboard would press
#    keyboard keys instead (this exact flow once saved "252" and no note).
- tapOn:
    id: "dashboard:addTransaction"
- assertVisible:
    id: "transactionCreation:root"
- tapOn:
    id: "transactionCreation:note"
- inputText: "Maestro golden expense"
- tapOn:
    id: "transactionCreation:amount"
- inputText: "25"
- tapOn:
    id: "transactionCreation:save"

# 6. Balance updates — back on the Dashboard, the new transaction is listed.
- assertVisible:
    id: "dashboard:root"
- assertVisible:
    text: "Maestro golden expense"

# 7. Settings shows the offline row set — asserted both ways. Every row the
#    offline build composes is pinned positively by its stable id, so a row
#    silently disappearing (or never being wired, as Preferences and Backup
#    were) fails the flow; Sync and Logout are never composed offline, and
#    `notVisible` on their ids keeps that gating honest. Both directions are
#    locale-independent. Preferences and Backup are composed in *both* builds:
#    Preferences has nothing online-only in it, and the Backup screen hides its
#    cloud schedule/"Back up now"/"Delete cloud backup" surfaces offline,
#    leaving the local archive + restore pair.
- tapOn:
    id: "dashboard:settings"
- assertVisible:
    id: "settings:root"
- assertVisible:
    id: "settings:categoriesRow"
- assertVisible:
    id: "settings:budgetsRow"
- assertVisible:
    id: "settings:appearanceRow"
- scrollUntilVisible:
    element:
      id: "settings:preferencesRow"
    direction: DOWN
- assertVisible:
    id: "settings:preferencesRow"
- assertNotVisible:
    id: "settings:syncRow"
- scrollUntilVisible:
    element:
      id: "settings:backupRow"
    direction: DOWN
- assertVisible:
    id: "settings:backupRow"
- assertVisible:
    id: "settings:csvRow"
- scrollUntilVisible:
    element:
      id: "settings:aboutRow"
    direction: DOWN
- assertVisible:
    id: "settings:aboutRow"
- assertNotVisible:
    id: "settings:logoutRow"
