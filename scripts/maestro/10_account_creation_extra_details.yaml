appId: ${APP_ID}
name: Account — Create card account with extra details
---
- runFlow: 02_workspace_create.yaml

- runFlow:
    when:
      notVisible: "Travel Card"
    commands:
      - tapOn:
          id: "dashboard:addAccount"
      - assertVisible:
          id: "accountCreation:root"
      - tapOn:
          id: "accountCreation:type:card"
      - tapOn:
          id: "accountCreation:name"
      - inputText: "Travel Card"
      - tapOn:
          id: "accountCreation:openingBalance"
      - inputText: "123.45"
      # Extra details are opt-in: the "IBAN" chip *adds* the field, it isn't the
      # field. Both carry the same label, so the old `tapOn: text: "IBAN"` hit
      # the chip and the IBAN string that followed went to whatever was still
      # focused — the opening-balance input. Tap the chip, then the field it
      # created, and only then type (#352).
      - tapOn:
          id: "accountCreation:addExtra:iban"
      - tapOn:
          id: "accountCreation:iban"
      - inputText: "ES9121000418450200051332"
      - tapOn:
          id: "accountCreation:save"

- assertVisible:
    id: "dashboard:accounts"
- assertVisible:
    text: "Travel Card"
