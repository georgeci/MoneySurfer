appId: ${APP_ID}
name: Auth — Sign in with test user
---
# Tag-driven sign-in flow. Selectors target Compose `testTag` values from
# `feature/login/.../SignInScreen.kt::SignInTestTags`, exposed to Maestro via
# `Modifier.semantics { testTagsAsResourceId = true }` on the screen root.

# Sign-in smoke test must start logged-out — wipe app data so a leftover
# session from an earlier flow (or a previous suite run on the same AVD)
# can't skip the screen we want to validate.
- launchApp:
    clearState: true

- assertVisible:
    id: "signIn:root"
- assertVisible:
    id: "signIn:brandHeader"
- assertVisible:
    id: "signIn:heroTitle"
- assertVisible:
    id: "signIn:sheet"

# Advance between fields via the keyboard IME actions rather than tapping the
# password field / submit button directly: on the iOS Simulator both sit behind
# the keyboard raised by the email field, so a direct tap is swallowed (#219).
# Email is ImeAction.Next (Enter → password), password is ImeAction.Done
# (Enter → dismiss keyboard); the submit button is then unobscured.
- tapOn:
    id: "signIn:email"
- inputText: ${TEST_EMAIL}
- pressKey: Enter

- inputText: ${TEST_PASSWORD}
- pressKey: Enter

- tapOn:
    id: "signIn:submit"

# Sign-in lands on the workspace picker, or straight on the dashboard when a
# workspace is already selected. Wait for the more common destination, then
# assert unconditionally that the sign-in screen is behind us.
#
# This used to be two `when: visible: X` blocks that each asserted X — both
# tautologies. If the sign-in failed and the app stayed put, neither condition
# held, neither block ran, and this flow reported a pass having asserted
# nothing: a sign-in smoke test that could not fail on a failed sign-in
# (#351 review). Leaving the screen is the one thing that must be true either
# way, so that is what gets asserted.
- extendedWaitUntil:
    visible:
      id: "workspaceSelector:root"
    timeout: 15000
    optional: true

- assertNotVisible:
    id: "signIn:root"
# A rejected sign-in raises the error dialog (#360) rather than failing silently,
# so its absence is a second, independent way of saying the credentials took.
- assertNotVisible:
    id: "signIn:errorDialog"
