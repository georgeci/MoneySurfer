appId: ${APP_ID}
name: Categories — Manage and create a category
---
# Settings → Categories → New category → save → returns to list with new row.
# Pre-condition: an active workspace; piggyback on the dashboard baseline.

- runFlow: 03_dashboard_add_account.yaml

- tapOn:
    text: "Settings"

- assertVisible:
    text: "Settings"

- scrollUntilVisible:
    element:
      text: "Categories"
    direction: DOWN
- tapOn:
    text: "Categories"

# Categories management screen. The "New category" FAB has an explicit
# contentDescription set in CategoriesManageScreen so Maestro can match it
# by `text:` (which on Android falls back to contentDescription).
- assertVisible:
    text: "Categories"

- runFlow:
    when:
      notVisible: "Coffee"
    commands:
      - tapOn:
          text: "New category"

      # Category creation screen
      - assertVisible:
          text: "New category"
      - assertVisible:
          text: "Type"
      - tapOn:
          text: "Name"
      - inputText: "Coffee"
      - tapOn:
          text: "Save"

# Back on Categories list. The list is scrollable and includes both the
# default seed categories (Income + Expense) and our new "Coffee" — which
# sits below the fold, so scroll to it before asserting.
- assertVisible:
    text: "Categories"
- scrollUntilVisible:
    element:
      text: "Coffee"
    direction: DOWN
- assertVisible:
    text: "Coffee"
