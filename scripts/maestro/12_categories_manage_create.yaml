appId: ${APP_ID}
name: Categories — Manage and create a category
---
# Settings → Categories → New category → save → returns to list with new row.
# Pre-condition: an active workspace; piggyback on the dashboard baseline.

- runFlow: 03_dashboard_add_account.yaml

- tapOn:
    text: "Settings"

- assertVisible:
    text: "Settings"

- scrollUntilVisible:
    element:
      text: "Categories"
    direction: DOWN
- tapOn:
    text: "Categories"

# Categories management screen. The "New category" FAB is an
# ExtendedFloatingActionButton: in this Compose version the inner Text label
# is not propagated to the button's a11y node, so neither `text:` nor
# `content-desc:` selectors find it. Tap by relative point — the FAB always
# anchors to bottom-right of the Scaffold.
- assertVisible:
    text: "Categories"

- runFlow:
    when:
      notVisible: "Coffee"
    commands:
      - tapOn:
          point: "80%, 95%"

      # Category creation screen
      - assertVisible:
          text: "New category"
      - assertVisible:
          text: "Type"
      - tapOn:
          text: "Name"
      - inputText: "Coffee"
      - tapOn:
          text: "Save"

# Back on Categories list. The list is scrollable and includes both the
# default seed categories (Income + Expense) and our new "Coffee" — which
# sits below the fold, so scroll to it before asserting.
- assertVisible:
    text: "Categories"
- scrollUntilVisible:
    element:
      text: "Coffee"
    direction: DOWN
- assertVisible:
    text: "Coffee"
