appId: ${APP_ID}
name: Categories — Manage and create a category
---
# Settings → Categories → New category → save → returns to list with new row.
# Pre-condition: an active workspace; piggyback on the dashboard baseline.
#
# Every selector here used to be product copy, and "Categories" matched both the
# settings row and the title of the screen it opens — so the flow could not tell
# "I am about to tap the row" from "I have arrived" (#352).

- runFlow: 03_dashboard_add_account.yaml

- tapOn:
    id: "dashboard:settings"

- assertVisible:
    id: "settings:root"

- scrollUntilVisible:
    element:
      id: "settings:categoriesRow"
    direction: DOWN
- tapOn:
    id: "settings:categoriesRow"

- assertVisible:
    id: "categoriesManage:root"

- runFlow:
    when:
      notVisible: "Coffee"
    commands:
      - tapOn:
          id: "categoriesManage:add"

      # Category creation screen
      - assertVisible:
          id: "categoryCreation:root"
      - tapOn:
          id: "categoryCreation:name"
      - inputText: "Coffee"
      - tapOn:
          id: "categoryCreation:save"

# Back on Categories list. The list is scrollable and includes both the
# default seed categories (Income + Expense) and our new "Coffee" — which
# sits below the fold, so scroll to it before asserting.
- assertVisible:
    id: "categoriesManage:root"
- scrollUntilVisible:
    element:
      text: "Coffee"
    direction: DOWN
- assertVisible:
    text: "Coffee"
