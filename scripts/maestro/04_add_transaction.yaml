appId: ${APP_ID}
name: Transaction — Add expense transaction
---
# Pre-condition: Dashboard with at least one account
# Chain after 03_dashboard_add_account.yaml

- runFlow: 03_dashboard_add_account.yaml

# Create the baseline expense once and reuse it across transaction flows.
#
# Scroll Recent into view before the guard reads it: `notVisible` tests what is
# on screen, and 03 leaves the dashboard parked on the Accounts widget, with
# Recent further down still (#297). Without this the guard sees no
# "Test expense" on every run and adds another one.
- scrollUntilVisible:
    element:
      id: "dashboard:recent"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      notVisible: "Test expense"
    commands:
      # Drive this screen by testTag, not by label: the dashboard FAB exposes no
      # accessibility text on iOS (only `dashboard:addTransaction`), so a `text`
      # selector finds nothing once the empty-state CTA is gone (issue #219).
      - tapOn:
          id: "dashboard:addTransaction"
      - assertVisible:
          id: "transactionCreation:root"
      # Fill the note *before* the amount. The amount field raises a numeric
      # keypad that covers the note field, so tapping the note afterwards lands
      # on the keypad instead — silently appending a digit to the amount (50 →
      # 501) and leaving the note empty. The amount field and Save both sit
      # above the keyboard, so they stay reachable in this order.
      - tapOn:
          id: "transactionCreation:note"
      - inputText: "Test expense"
      - tapOn:
          id: "transactionCreation:amount"
      - inputText: "50"
      - tapOn:
          id: "transactionCreation:save"

# Back on the Dashboard — Save navigates ahead of the write landing, and the
# screen reopens at the top, so wait for the root and scroll down to Recent.
- extendedWaitUntil:
    visible:
      id: "dashboard:root"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Test expense"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "dashboard:recent"
- assertVisible:
    text: "Test expense"
