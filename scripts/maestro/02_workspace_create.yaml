appId: ${APP_ID}
name: Workspace — Create and select test workspace
---
# Chain after 00_login.yaml or run standalone with an existing session.
#
# This flow is the suite's workspace *entry gate*: every flow that needs the
# shared fixture chains it, and it guarantees "Test Workspace" is active by the
# time it returns — whatever workspace the previous flow happened to leave
# selected. Earlier revisions relied on the opposite arrangement, where the one
# flow that switches workspaces (03a) had to switch back on its way out. That
# tail never runs when the flow fails mid-way, and every later flow then wrote
# its fixtures into the wrong workspace (issues #297, #351).

- runFlow: 00_login.yaml

# A restored session lands on either the workspace picker or — once a workspace
# has been selected on a prior run, since the app persists the active workspace
# across launches — straight on the dashboard.
#
# Case 1: not on the picker (a restored session lands straight on a dashboard).
# Walk back to the picker unconditionally and let case 2 below select the right
# workspace.
#
# Unconditionally, rather than short-circuiting when the toolbar already names
# `Test Workspace`. That branch existed here before and was dead weight: until
# #442 `DashboardViewModel` passed `workspaceName = null`, so the toolbar always
# read the default title and the guard was always false — the flow detoured
# through Settings every single run anyway, after first burning a 15s wait on a
# name that could not arrive (#297). #442 wires the name, so the short-circuit
# could work now; it stays out because paying a couple of taps every time beats
# paying a multi-second wait every time, and because a branch that only triggers
# when a *different* workspace is selected is the branch least likely to be
# exercised and most likely to rot.
- runFlow:
    when:
      notVisible:
        id: "workspaceSelector:root"
    commands:
      - tapOn:
          id: "dashboard:settings"
      - assertVisible:
          id: "settings:root"
      - tapOn:
          id: "settings:workspaceRow"
      - extendedWaitUntil:
          visible:
            id: "workspaceSelector:root"
          timeout: 20000

# Case 2: the picker is up — create the workspace when it's missing, then select
# and confirm it.
#
# The workspace *name* stays a `text:` selector throughout: it is fixture data
# this suite typed in, not product copy (see README.md → Selectors).
- runFlow:
    when:
      visible:
        id: "workspaceSelector:root"
    commands:
      # Branch on the workspace *row*, not on the confirm button: that button is
      # labelled after whichever workspace is currently highlighted ("Use Empty
      # Workspace" when 03a's fixture is active), so keying off it would create a
      # duplicate "Test Workspace" on every such run (#219).
      - runFlow:
          when:
            notVisible: "Test Workspace"
          commands:
            - tapOn:
                id: "workspaceSelector:create"
            - assertVisible:
                id: "workspaceCreation:root"
            - tapOn:
                id: "workspaceCreation:name"
            - inputText: "Test Workspace"
            # Don't hideKeyboard: the AVD runs with hw.keyboard=yes, so no soft IME
            # is shown; Maestro then falls back to a BACK keypress which dismisses
            # the creation screen. The "Create" action lives in the TopAppBar so
            # the (absent) keyboard never overlaps it anyway.
            - tapOn:
                id: "workspaceCreation:save"

      # Select the row, then confirm — the picker only enables the confirm
      # button for the highlighted workspace, and labels it after that
      # workspace ("Use Test Workspace"). Tapping the row is therefore both the
      # selection and the only place the choice is visible at all.
      - tapOn:
          text: "Test Workspace"
      - tapOn:
          id: "workspaceSelector:confirm"

# Landed on the Dashboard, in the workspace this flow promises. Both are waited
# on rather than asserted: confirming writes the active workspace before it
# navigates, and the toolbar name arrives with the rest of the dashboard state.
#
# The name is worth asserting again now that #442 wires `workspaceName` through
# `DashboardViewModel` — before that it was hardcoded to null and this assertion
# could only ever fail (#297). It is the one check that this flow delivered the
# workspace it claims to, rather than leaving whichever one happened to be
# selected; without it a wrong choice would surface much later, as a missing
# fixture in some unrelated flow.
- extendedWaitUntil:
    visible:
      id: "dashboard:root"
    timeout: 30000
- extendedWaitUntil:
    visible: "Test Workspace"
    timeout: 20000
