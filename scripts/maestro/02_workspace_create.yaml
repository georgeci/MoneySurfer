appId: ${APP_ID}
name: Workspace — Create and select test workspace
---
# Chain after 00_login.yaml or run standalone with an existing session.
#
# This flow is the suite's workspace *entry gate*: every flow that needs the
# shared fixture chains it, and it guarantees "Test Workspace" is active by the
# time it returns — whatever workspace the previous flow happened to leave
# selected. Earlier revisions relied on the opposite arrangement, where the one
# flow that switches workspaces (03a) had to switch back on its way out. That
# tail never runs when the flow fails mid-way, and every later flow then wrote
# its fixtures into the wrong workspace (issues #297, #351).

- runFlow: 00_login.yaml

# A restored session lands on either the workspace picker or — once a workspace
# has been selected on a prior run, since the app persists the active workspace
# across launches — straight on the dashboard.
#
# Case 1: already on a dashboard. The toolbar renders the active workspace name,
# so a missing "Test Workspace" means a different workspace is selected; walk
# back to the picker and let case 2 below fix it.
- runFlow:
    when:
      notVisible:
        id: "workspaceSelector:root"
    commands:
      - runFlow:
          when:
            notVisible: "Test Workspace"
          commands:
            - tapOn:
                id: "dashboard:settings"
            - assertVisible:
                id: "settings:root"
            - tapOn:
                id: "settings:workspaceRow"
            - assertVisible:
                id: "workspaceSelector:root"

# Case 2: the picker is up — create the workspace when it's missing, then select
# and confirm it.
#
# The workspace *name* stays a `text:` selector throughout: it is fixture data
# this suite typed in, not product copy (see README.md → Selectors).
- runFlow:
    when:
      visible:
        id: "workspaceSelector:root"
    commands:
      # Branch on the workspace *row*, not on the confirm button: that button is
      # labelled after whichever workspace is currently highlighted ("Use Empty
      # Workspace" when 03a's fixture is active), so keying off it would create a
      # duplicate "Test Workspace" on every such run (#219).
      - runFlow:
          when:
            notVisible: "Test Workspace"
          commands:
            - tapOn:
                id: "workspaceSelector:create"
            - assertVisible:
                id: "workspaceCreation:root"
            - tapOn:
                id: "workspaceCreation:name"
            - inputText: "Test Workspace"
            # Don't hideKeyboard: the AVD runs with hw.keyboard=yes, so no soft IME
            # is shown; Maestro then falls back to a BACK keypress which dismisses
            # the creation screen. The "Create" action lives in the TopAppBar so
            # the (absent) keyboard never overlaps it anyway.
            - tapOn:
                id: "workspaceCreation:save"

      # Select the row, then confirm — the picker only enables the confirm
      # button for the highlighted workspace.
      - tapOn:
          text: "Test Workspace"
      - tapOn:
          id: "workspaceSelector:confirm"

# Assert we landed on Dashboard content, in the workspace this flow promises.
- assertVisible:
    id: "dashboard:root"
- assertVisible:
    text: "Test Workspace"
