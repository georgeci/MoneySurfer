appId: ${APP_ID}
name: Sync — Force sync now from Sync hub
tags:
  - sync
---
# Pre-condition: active workspace and dashboard.
# Settings → Sync → "Force sync now" → wait for the run to complete.
#
# EXCLUDED from the default online suite (tag `sync`). Sync has been gated off
# since #110: `OnlineSignInModule` binds `SyncFeatureFlag(enabled = false)` and
# `SettingsState.showSyncSection` hides the row, so there is no Sync hub to open
# in the shipped online build and this flow cannot pass (issue #219). Re-include
# it — drop the tag from `maestroSyncTags` in gradle/qa.gradle.kts — once the
# flag is flipped on.

- runFlow: 03_dashboard_add_account.yaml

- tapOn:
    id: "dashboard:settings"
- assertVisible:
    id: "settings:root"

- tapOn:
    id: "settings:syncRow"

# Sync screen
- assertVisible:
    text: "Sync"
- assertVisible:
    text: "Force sync now"

- tapOn:
    text: "Force sync now"

# After triggering, the hero stays on screen and the action remains tappable.
# Don't assert the in-progress label (race-y on emulator with seeded data).
- assertVisible:
    text: "Force sync now"

- tapOn:
    id: "toolbar:back"
- assertVisible:
    id: "settings:root"
