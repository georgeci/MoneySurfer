appId: ${APP_ID}
name: Account — Create savings account with opening balance
---
# Pre-condition: active workspace; baseline account already created.
# Exercises the "Savings" account type which other flows don't cover.
#
# Creation goes through Accounts → Manage, not the dashboard CTA. That CTA is an
# empty-state affordance: `SurferAccountsWidget` composes it only while the
# account list is empty, and this flow chains 03, which guarantees "Main Bank"
# exists. Tapping it here could never resolve — the flow was failing on every
# run for as long as it has existed (#351 review).
- runFlow: 03_dashboard_add_account.yaml

- runFlow:
    when:
      notVisible: "Rainy Day"
    commands:
      - tapOn:
          id: "dashboard:accountsManage"
      - assertVisible:
          id: "accountsManage:root"
      - tapOn:
          id: "accountsManage:add"
      - assertVisible:
          id: "accountCreation:root"

      - tapOn:
          id: "accountCreation:type:savings"

      - tapOn:
          id: "accountCreation:name"
      - inputText: "Rainy Day"
      - tapOn:
          id: "accountCreation:openingBalance"
      - inputText: "2500"

      - tapOn:
          id: "accountCreation:save"

# Saving returns to the accounts list this flow came from; walk back to the
# dashboard so the closing assertions run where the other flows expect to be.
- runFlow:
    when:
      visible:
        id: "accountsManage:root"
    commands:
      - tapOn:
          id: "toolbar:back"

- assertVisible:
    id: "dashboard:accounts"
- assertVisible:
    text: "Rainy Day"
- assertVisible:
    text: "Main Bank"
