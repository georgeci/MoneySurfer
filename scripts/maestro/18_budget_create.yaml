appId: ${APP_ID}
name: Budgets — Create a budget and see it on the list
---
# Settings → Budgets → New budget → name + limit → save → the card is on the list.
# Pre-condition: an active workspace; piggyback on the dashboard baseline.

- runFlow: 03_dashboard_add_account.yaml

- tapOn:
    id: "dashboard:settings"

- assertVisible:
    id: "settings:root"

- scrollUntilVisible:
    element:
      id: "settings:budgetsRow"
    direction: DOWN
- tapOn:
    id: "settings:budgetsRow"

- assertVisible:
    id: "budgets:root"

- runFlow:
    when:
      notVisible: "Coffee cap"
    commands:
      - tapOn:
          id: "budgets:add"

      # Create screen: name, limit, then save. Period defaults to Monthly and
      # the category chips default to "All categories", so a general budget
      # needs nothing else filled in.
      - assertVisible:
          id: "budgetEdit:root"
      # Remaining copy selector: the default category scope has no testTag yet,
      # and this is the one assertion that the default actually holds (#352).
      - assertVisible:
          text: "All categories"
      - tapOn:
          id: "budgetEdit:name"
      - inputText: "Coffee cap"
      - tapOn:
          id: "budgetEdit:amount"
      - inputText: "150"
      - hideKeyboard
      - tapOn:
          id: "budgetEdit:save"

# Back on the list with the new card, showing its spend against the limit.
- assertVisible:
    id: "budgets:root"
- scrollUntilVisible:
    element:
      text: "Coffee cap"
    direction: DOWN
- assertVisible:
    text: "Coffee cap"

# Open it: the details hero shows the spend ring.
- tapOn:
    text: "Coffee cap"
- assertVisible:
    id: "budgetDetails:root"
- assertVisible:
    id: "budgetDetails:ring"
