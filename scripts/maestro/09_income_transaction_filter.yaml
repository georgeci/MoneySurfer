appId: ${APP_ID}
name: Transaction — Add income and filter list
---
- runFlow: 03_dashboard_add_account.yaml

- runFlow:
    when:
      notVisible: "Salary"
    commands:
      # testTag selectors + note-before-amount ordering — see the rationale in
      # 04_add_transaction.yaml.
      - tapOn:
          id: "dashboard:addTransaction"
      - assertVisible:
          id: "transactionCreation:root"
      - tapOn:
          id: "transactionCreation:type:income"
      - tapOn:
          id: "transactionCreation:note"
      - inputText: "Salary"
      - tapOn:
          id: "transactionCreation:amount"
      - inputText: "150"
      - tapOn:
          id: "transactionCreation:save"

- assertVisible:
    id: "dashboard:recent"
- assertVisible:
    text: "Salary"

- tapOn:
    id: "dashboard:recentSeeAll"
- assertVisible:
    id: "transactionsList:root"

# The list no longer filters in place: since the filters screen landed (#329),
# every chip on the rail opens it and the type is committed from there. The old
# `tapOn: text: "Income"` targeted an inline chip that no longer exists — the
# kind of silent drift a tag-based selector turns into an obvious failure (#352).
- tapOn:
    id: "transactionsList:filter:type"
- assertVisible:
    id: "transactionFilters:root"
- tapOn:
    id: "transactionFilters:type:income"
- tapOn:
    id: "transactionFilters:apply"

- assertVisible:
    id: "transactionsList:root"
- assertVisible:
    text: "Salary"
# Locale-agnostic: the simulator's region decides both the decimal separator and
# whether the symbol leads or trails ("€150.00" vs "150,00 €"). The `.*` wrappers
# are required because Maestro's iOS driver matches the pattern against the whole
# element label, not as a substring (#219).
- assertVisible:
    text: ".*150[.,]00.*"
