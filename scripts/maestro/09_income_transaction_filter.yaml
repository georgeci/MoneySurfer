appId: ${APP_ID}
name: Transaction — Add income and filter list
---
- runFlow: 03_dashboard_add_account.yaml

- runFlow:
    when:
      notVisible: "Salary"
    commands:
      # testTag selectors + note-before-amount ordering — see the rationale in
      # 04_add_transaction.yaml.
      - tapOn:
          id: "dashboard:addTransaction"
      - assertVisible:
          id: "transactionCreation:root"
      - tapOn:
          text: "Income"
      - tapOn:
          id: "transactionCreation:note"
      - inputText: "Salary"
      - tapOn:
          id: "transactionCreation:amount"
      - inputText: "150"
      - tapOn:
          id: "transactionCreation:save"

- assertVisible:
    text: "Recent"
- assertVisible:
    text: "Salary"

- tapOn:
    text: "See all"
- assertVisible:
    text: "Transactions"
- tapOn:
    text: "Income"
- assertVisible:
    text: "Salary"
# Locale-agnostic: the simulator's region decides both the decimal separator and
# whether the symbol leads or trails ("€150.00" vs "150,00 €"). The `.*` wrappers
# are required because Maestro's iOS driver matches the pattern against the whole
# element label, not as a substring (#219).
- assertVisible:
    text: ".*150[.,]00.*"
